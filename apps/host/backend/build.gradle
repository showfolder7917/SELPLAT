plugins {
    // platform-runtime 是统一 JVM 的目标启动入口，application 插件提供受终端托管的 run 任务。
    id 'application'
}

// host/backend 使用宿主专属坐标，避免与其他名为 backend 的应用模块发生组件替换。
group = 'com.sp.selplat.host'

dependencies {
    // 统一宿主从唯一公共模块发布 /sel/** 主题、组件和素材。
    runtimeOnly project(':shared:frontend:sel-ui')
    // Uniauth 作为显式业务模块装配到统一端口，同时继续保留自己的独立启动入口。
    implementation project(':apps:uniauth:backend')
    // 公共结果和 JSON 工具用于平台健康响应保持 SELPLAT 统一结构。
    implementation project(':shared:backend:common-core')
    // 当前宿主显式装配 reference-data 的四张表业务和查询路由。
    implementation project(':apps:reference-data:backend')
    // MDA 通过模块自持数据库上下文接入统一端口，不占用宿主主数据源。
    implementation project(':apps:mda:backend')
    // SELPLAT-GENERATED-MODULES
    implementation project(':apps:japanese:backend')
    // Web Starter 提供唯一内嵌 HTTP 容器和平台级 Controller。
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    // DevTools 为后续开发启动模式提供类路径变化后的自动重启能力。
    runtimeOnly "org.springframework.boot:spring-boot-devtools:${springBootVersion}"
    // Spring Boot Test 和 MockMvc 验证宿主上下文、模块装配与健康接口。
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
}

application {
    // host 是 platform-runtime 唯一目标启动类，不使用业务模块自己的 main 方法。
    mainClass = 'com.sp.selplat.host.PlatformRuntimeApplication'
}

// Gradle 生成的工程 JAR 与开发进程直接共用路径时，覆盖 JAR 会使旧类加载器持有的 ZIP 句柄失效。
def runtimeProjectJarFiles = providers.provider {
    def rootBuildPath = rootProject.layout.buildDirectory.get().asFile.toPath().normalize()
    configurations.runtimeClasspath.files.findAll { runtimeFile ->
        runtimeFile.isFile()
                && runtimeFile.name.endsWith('.jar')
                && runtimeFile.toPath().normalize().startsWith(rootBuildPath)
    }
}

// 第三方依赖位于只读缓存，不参与本工程重编译，可以继续由 JVM 直接加载。
def runtimeExternalFiles = providers.provider {
    def rootBuildPath = rootProject.layout.buildDirectory.get().asFile.toPath().normalize()
    configurations.runtimeClasspath.files.findAll { runtimeFile ->
        !runtimeFile.toPath().normalize().startsWith(rootBuildPath)
    }
}

tasks.register('syncVsCodeResources', Copy) {
    // 平台配置同步到统一 class 输出，保证 VS Code 与 Gradle run 使用相同资源。
    from(sourceSets.main.resources)
    into(layout.buildDirectory.dir('classes/java/main'))
}

tasks.named('classes') {
    // 启动宿主前同步平台配置，并准备显式装配模块的 JAR。
    dependsOn tasks.named('syncVsCodeResources')
    dependsOn ':shared:backend:common-core:jar'
    dependsOn ':apps:reference-data:backend:jar'
    dependsOn ':apps:mda:backend:jar'
    // 公共前端和 Uniauth 资源必须在 Host 启动前生成可依赖 JAR。
    dependsOn ':shared:frontend:sel-ui:jar'
    dependsOn ':apps:uniauth:backend:jar'
}

tasks.register('prepareDevRuntimeClasses', Sync) {
    // 先生成所有工程依赖，再把 JAR 展开到开发进程专用目录，彻底隔离构建路径与运行路径。
    dependsOn tasks.named('classes')
    into(layout.buildDirectory.dir('dev-runtime/classes'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(runtimeProjectJarFiles.map { projectJars ->
        projectJars.collect { projectJar -> zipTree(projectJar) }
    })
    // 同步依赖类时保留安全重启信号；只有 signalDevReload 可以修改它。
    preserve {
        include 'reload.trigger'
    }
    doLast {
        File reloadTrigger = layout.buildDirectory.file('dev-runtime/classes/reload.trigger').get().asFile
        if (!reloadTrigger.exists()) {
            reloadTrigger.setText('initial', 'UTF-8')
        }
    }
}

tasks.named('run') {
    // 开发启动只读取展开后的工程类快照，后续构建不再覆盖运行进程正在读取的 JAR。
    dependsOn tasks.named('prepareDevRuntimeClasses')
    doFirst {
        classpath = files(
                sourceSets.main.output,
                layout.buildDirectory.dir('dev-runtime/classes'),
                runtimeExternalFiles.get())
    }
}

tasks.register('signalDevReload') {
    // 先完成全部工程类快照，再通知 DevTools 使用完整快照重启。
    dependsOn tasks.named('prepareDevRuntimeClasses')
    // 连续构建每轮都需要更新触发文件，不能因为没有正式输出声明而跳过通知。
    outputs.upToDateWhen { false }
    doLast {
        // 已完成全部依赖类快照 → 更新开发运行目录中的唯一安全重启信号。
        File reloadTrigger = layout.buildDirectory.file('dev-runtime/classes/reload.trigger').get().asFile
        reloadTrigger.parentFile.mkdirs()
        reloadTrigger.setText(String.valueOf(System.currentTimeMillis()), 'UTF-8')
    }
}

tasks.named('jar') {
    // VS Code 资源同步目录与标准 resources 都进入 JAR 时保留第一份，避免平台配置重复。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('installDist') {
    // 统一宿主聚合多个模块时，同名离线依赖只写入一次分发目录。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
