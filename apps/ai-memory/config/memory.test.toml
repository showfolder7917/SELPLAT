[server]
base_url = "http://127.0.0.1:8091"
api_version = "v1"

[client]
client_id = "CLIENT-UNIFIED-TEST"

[runtime]
root = "OPTION/temp/ai-factory"
poll_interval_seconds = 0.1

[state]
sqlite_path = "OPTION/temp/ai-factory/状态/memory-test.db"

[sync]
connect_timeout_seconds = 15
retry_max_seconds = 1

[evidence]
upload_policy = "DIGEST_ONLY"

[codex]
persistent_max_connections = 1
disposable_max_connections = 1
command = "/usr/bin/true"
