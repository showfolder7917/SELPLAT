[server]
base_url = "http://127.0.0.1:8091"
api_version = "v1"

[client]
client_id = "CLIENT-LOCAL-CODEX"

[runtime]
root = "OPTION/temp/ai-factory"
poll_interval_seconds = 3

[state]
sqlite_path = "OPTION/temp/ai-factory/状态/memory.db"

[sync]
connect_timeout_seconds = 15
retry_max_seconds = 300

[evidence]
upload_policy = "DIGEST_ONLY"

[codex]
max_connections = 2
command = "codex"
