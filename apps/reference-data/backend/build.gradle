plugins {
    // backend 对 host 暴露模块配置和五个表业务，因此保持标准 Java library 依赖语义。
    id 'java-library'
}

// 独立模块坐标用于区分 host/backend、uniauth/backend 等同名 Gradle 子项目。
group = 'com.sp.selplat.referencedata'

dependencies {
    // 公共结果、JSON 工具和自定义异常用于固定 API 成功与失败契约。
    implementation project(':shared:backend:common-core')
    // 公共数据库与服务层提供 CommonSequenceSegment DAO 和多进程安全号段生成器。
    implementation project(':shared:backend:common-db')
    implementation project(':shared:backend:common-service')
    // 公共 Web 层提供统一异常响应和请求追踪，不在模块内复制处理器。
    implementation project(':shared:backend:common-web')
    // JDBC Starter 提供 reference-data 独立文件数据库所需的模板与事务能力。
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"
    // Web Starter 提供 Controller 注解、参数绑定和 Host 内的 HTTP 路由。
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    // H2 仅在运行期承载 apps/reference-data/db 中的永久本地数据库。
    runtimeOnly "com.h2database:h2:${h2Version}"
    // Spring Boot Test 提供 JUnit 5、MockMvc 和 JSON 响应断言。
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
}

tasks.named('processResources') {
    // db/sql 是 reference-data 数据库脚本的唯一权威来源，构建时只复制结构和初始化 SQL，不复制运行数据文件。
    from('../db/sql') {
        include '*.sql'
        into 'db/reference-data/sql'
    }
}

tasks.named('classes') {
    // HTTP API 编译前准备公共 JSON、异常和 Web 处理能力。
    dependsOn ':shared:backend:common-core:jar'
    dependsOn ':shared:backend:common-db:jar'
    dependsOn ':shared:backend:common-service:jar'
    dependsOn ':shared:backend:common-web:jar'
}
