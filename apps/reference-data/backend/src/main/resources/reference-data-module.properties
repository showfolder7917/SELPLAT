# 未显式指定数据库 URL 时，由模块从当前工程根定位 apps/reference-data/db/reference-data。
reference-data.datasource.jdbc-url=
reference-data.datasource.pool-name=ReferenceDataPool
reference-data.datasource.username=sa
reference-data.datasource.password=123456
reference-data.datasource.driver-class-name=org.h2.Driver
reference-data.datasource.minimum-idle=1
reference-data.datasource.maximum-pool-size=4
reference-data.datasource.connection-timeout=10000
reference-data.datasource.idle-timeout=300000
reference-data.datasource.max-lifetime=1800000
