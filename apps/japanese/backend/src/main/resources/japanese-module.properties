# 免费插件统一归档到 OPTION/plugin；语音与翻译保持独立虚拟环境。
japanese.ai.edge-tts.executable=${JAPANESE_EDGE_TTS_EXECUTABLE:/Users/showfolder/Documents/workSpace/SELF/SELPLAT/OPTION/plugin/edge-tts-venv/bin/edge-tts}
japanese.ai.deep-translator.executable=${JAPANESE_DEEP_TRANSLATOR_EXECUTABLE:/Users/showfolder/Documents/workSpace/SELF/SELPLAT/OPTION/plugin/deep-translator-venv/bin/deep-translator}
# Codex 原图统一由 FFmpeg 转为质量 82 的 WebP 后才进入静态目录。
japanese.ai.ffmpeg.executable=${JAPANESE_FFMPEG_EXECUTABLE:/opt/homebrew/bin/ffmpeg}
