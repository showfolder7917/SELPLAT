# Uniauth 使用模块私有永久连接池；JDBC URL 留空时固定解析到 apps/uniauth/db/uniauth.mv.db。
uniauth.datasource.jdbc-url=
uniauth.datasource.pool-name=UniauthPool
uniauth.datasource.username=sa
uniauth.datasource.password=123456
uniauth.datasource.driver-class-name=org.h2.Driver
uniauth.datasource.minimum-idle=1
uniauth.datasource.maximum-pool-size=4
uniauth.datasource.connection-timeout=10000
uniauth.datasource.idle-timeout=300000
uniauth.datasource.max-lifetime=1800000

mybatis.configuration.map-underscore-to-camel-case=true
