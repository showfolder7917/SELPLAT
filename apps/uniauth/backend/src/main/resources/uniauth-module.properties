# Uniauth 模块的数据源和初始化脚本由独立应用与 platform-runtime 共同读取。
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:selplat_uniauth;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-uniauth.sql
spring.sql.init.data-locations=classpath:data-uniauth.sql

mybatis.configuration.map-underscore-to-camel-case=true
