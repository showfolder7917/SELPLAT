<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>项目管理 · 科技表格</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://i.pravatar.cc">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
    <link rel="stylesheet" href="./grid.css?v=20260730-9">
    <link rel="stylesheet" href="./gridmenu.css?v=20260730-1">
</head>
<body>
    <main class="project-stage">
        <section class="project-board" aria-label="项目管理表格">
            <div class="project-board__highlight" aria-hidden="true"></div>

            <div class="table-scroller">
                <table class="project-table">
                    <colgroup>
                        <col class="column-check">
                        <col class="column-project">
                        <col class="column-type">
                        <col class="column-owner">
                        <col class="column-status">
                        <col class="column-progress">
                        <col class="column-time">
                        <col class="column-actions">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="check-cell">
                                <button class="table-checkbox" id="select-all" type="button" role="checkbox" aria-checked="false" aria-label="选择全部项目"></button>
                            </th>
                            <th>项目名称</th>
                            <th>类型</th>
                            <th>负责人</th>
                            <th>状态</th>
                            <th>进度</th>
                            <th>
                                <button class="sort-button" type="button" aria-label="按更新时间降序排列">
                                    更新时间
                                    <i class="ri-arrow-down-line" aria-hidden="true"></i>
                                </button>
                            </th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="project-table-body"></tbody>
                </table>
            </div>

            <footer class="table-footer">
                <div class="table-summary">
                    <i class="ri-briefcase-4-line" aria-hidden="true"></i>
                    <span>共 128 条</span>
                    <label class="page-size-field">
                        <span class="sr-only">每页显示条数</span>
                        <select id="page-size">
                            <option value="10" selected>10 条/页</option>
                            <option value="20">20 条/页</option>
                            <option value="50">50 条/页</option>
                        </select>
                    </label>
                </div>

                <nav class="pagination" aria-label="项目分页">
                    <button class="page-button page-button--arrow" type="button" data-page-action="previous" aria-label="上一页">
                        <i class="ri-arrow-left-s-line" aria-hidden="true"></i>
                    </button>
                    <button class="page-button is-current" type="button" data-page="1" aria-current="page">1</button>
                    <button class="page-button" type="button" data-page="2">2</button>
                    <button class="page-button" type="button" data-page="3">3</button>
                    <button class="page-button" type="button" data-page="4">4</button>
                    <button class="page-button" type="button" data-page="5">5</button>
                    <span class="page-ellipsis" aria-hidden="true">…</span>
                    <button class="page-button" type="button" data-page="13">13</button>
                    <button class="page-button page-button--arrow" type="button" data-page-action="next" aria-label="下一页">
                        <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
                    </button>
                </nav>
            </footer>

            <aside class="grid-menu" id="project-menu" aria-label="项目操作菜单" aria-hidden="true"></aside>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./gridmenu.js?v=20260730-1"></script>
    <script src="./grid.js?v=20260730-5"></script>
</body>
</html>
