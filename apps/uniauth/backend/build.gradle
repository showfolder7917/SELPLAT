plugins {
    // Uniauth 后端需要独立启动，因此使用 application 插件提供 run 入口。
    id 'application'
    // JaCoCo 为真实业务测试生成覆盖率报告和覆盖门禁。
    id 'jacoco'
}

dependencies {
    // 复用通用结果、参数和基础工具。
    implementation project(':shared:backend:common-core')
    // 复用控制器基类和 MVC 参数解析能力。
    implementation project(':shared:backend:common-web')
    // 复用 Service 基类和统一业务服务契约。
    implementation project(':shared:backend:common-service')
    // 复用 DAO、MyBatis 模板和数据库公共能力。
    implementation project(':shared:backend:common-db')
    // 提供 HTTP Controller、JSON 序列化和嵌入式 Web 容器。
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    // 为业务操作日志切面提供 Spring 代理和 AspectJ 运行支持。
    implementation "org.springframework.boot:spring-boot-starter-aop:${springBootVersion}"
    // 提供数据源、JDBC 和事务边界。
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"
    // 提供注解式模板 Mapper 与 MyBatis-Spring 集成。
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"
    // Lombok 仅在编译期使用，统一从工程离线缓存读取。
    compileOnly files(rootProject.file("cache/cache-jars/lombok-${lombokVersion}.jar"))
    // 注解处理阶段使用同一个离线 Lombok JAR。
    annotationProcessor files(rootProject.file("cache/cache-jars/lombok-${lombokVersion}.jar"))
    // H2 用于本地运行和真实数据库集成测试。
    runtimeOnly "com.h2database:h2:${h2Version}"
    // DevTools 用于本地保存源码后的开发期自动重启。
    runtimeOnly "org.springframework.boot:spring-boot-devtools:${springBootVersion}"
    // 提供 Spring Boot、JUnit 和 MockMvc 测试能力。
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    // 测试源码使用 Lombok 时保持与主源码一致的编译依赖。
    testCompileOnly files(rootProject.file("cache/cache-jars/lombok-${lombokVersion}.jar"))
    // 测试注解处理阶段使用同一个离线 Lombok JAR。
    testAnnotationProcessor files(rootProject.file("cache/cache-jars/lombok-${lombokVersion}.jar"))
}

application {
    // run 任务固定启动 Uniauth HTTP 服务。
    mainClass = 'com.sp.selplat.uniauth.UniauthBackendApplication'
}

tasks.register('syncVsCodeResources', Copy) {
    // VS Code 的 Gradle Java 启动器只稳定装载编译类输出，因此同步标准资源到同一统一 build 类目录。
    from(sourceSets.main.resources)
    // 静态页面、配置和 SQL 初始化脚本 → 与应用 class 一起进入 VS Code 已加载的运行目录。
    into(layout.buildDirectory.dir('classes/java/main'))
}

tasks.named('classes') {
    // 编译完成前同步资源 → 每次 VS Code 启动前任务都会拥有最新页面和运行配置。
    dependsOn tasks.named('syncVsCodeResources')
    // 先生成公共核心 JAR，保证 IDE 与命令行都能读取统一构建产物。
    dependsOn ':shared:backend:common-core:jar'
    // 先生成公共数据库 JAR，保证 DAO 与 MyBatis 契约可用。
    dependsOn ':shared:backend:common-db:jar'
    // 先生成公共服务 JAR，保证 Service 继承结构可用。
    dependsOn ':shared:backend:common-service:jar'
    // 先生成公共 Web JAR，保证 Controller 基类和参数解析器可用。
    dependsOn ':shared:backend:common-web:jar'
}

jacoco {
    // 使用工程统一的 JaCoCo 版本，保证 Java 21 字节码覆盖结果一致。
    toolVersion = jacocoVersion
}

tasks.named('test') {
    // 测试结束后自动生成覆盖率报告。
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    // 先执行测试，报告才会读取本轮真实执行数据。
    dependsOn tasks.named('test')
    reports {
        // XML 供自动化覆盖核对使用。
        xml.required = true
        // HTML 供人工查看未覆盖代码。
        html.required = true
        // 当前不生成重复的 CSV 报告。
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    // 覆盖门禁必须建立在本轮测试执行数据上。
    dependsOn tasks.named('test')
    violationRules {
        rule {
            // 逐类验证当前 Uniauth 的业务执行类。
            element = 'CLASS'
            includes = [
                'com.sp.selplat.uniauth.user.controller.UniauthUserController',
                'com.sp.selplat.uniauth.user.service.impl.UniauthUserServiceImpl',
                'com.sp.selplat.uniauth.user.dao.UniauthUserDaoImpl'
            ]
            limit {
                // 每个纳入类都要求全部可执行行被真实测试覆盖。
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
        rule {
            // 用户服务包含业务分支，单独要求完整分支覆盖。
            element = 'CLASS'
            includes = ['com.sp.selplat.uniauth.user.service.impl.UniauthUserServiceImpl']
            limit {
                // 每个可达业务分支都必须经过真实 Case。
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

tasks.named('check') {
    // 标准检查必须包含覆盖门禁，防止只运行测试而漏掉覆盖要求。
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
