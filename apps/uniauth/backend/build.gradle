plugins {
    // 当前离线环境优先保证 Java 应用可编译可运行，因此用 application 插件提供统一启动入口。
    id 'application'
    // JaCoCo 以真实执行数据衡量生产代码覆盖率，避免用测试数量或 fixture 数量代替覆盖证据。
    id 'jacoco'
}

// 本地离线 jar 目录统一收口 Spring Boot、MyBatis 和测试依赖，保证无网环境下 backend 也能稳定导入。
def localCacheJarDir = rootProject.file('cache/cache-jars')

dependencies {
    // uniauth 后端依赖公共核心库，复用通用值处理等基础能力。
    implementation project(':shared:backend:common-core')
    // uniauth 后端依赖公共 Web 层，供业务控制器复用 BaseController 和 MVC 参数解析能力。
    implementation project(':shared:backend:common-web')
    // uniauth 后端依赖公共服务层，统一服务接口和实现类的继承结构。
    implementation project(':shared:backend:common-service')
    // uniauth 后端依赖公共数据库层，复用 BaseDao 与 BaseTemplateDao 等模板能力。
    implementation project(':shared:backend:common-db')
    // Web Starter 负责把 controller 暴露成 HTTP 接口。
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    // JDBC Starter 负责本地 H2 数据源和事务边界。
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"
    // MyBatis Starter 负责注解式 BaseTemplateDao 与 Spring 容器桥接，当前模块不使用 Mapper XML。
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"
    // Lombok 负责为 final 字段自动生成构造器，离线编译统一从工程根 cache/cache-jars 读取。
    compileOnly files(rootProject.file('cache/cache-jars/lombok-1.18.38.jar'))
    // 注解处理器与编译依赖使用同一个工程内离线 jar，避免依赖用户目录。
    annotationProcessor files(rootProject.file('cache/cache-jars/lombok-1.18.38.jar'))
    // H2 作为本地运行和最小联调数据库。
    runtimeOnly "com.h2database:h2:${h2Version}"
    // DevTools 负责在本地开发时监听 classpath 变化并触发应用重启，配合 VS Code 自动编译实现源码保存后自动重载。
    runtimeOnly "org.springframework.boot:spring-boot-devtools:${springBootVersion}"
    // Spring Boot 测试套件为后续控制层和服务层测试预留统一入口。
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    // 测试源码如果后续也使用 Lombok，这里同步补齐测试编译期离线 jar，避免主源码和测试源码口径分裂。
    testCompileOnly files(rootProject.file('cache/cache-jars/lombok-1.18.38.jar'))
    // 测试注解处理器与主源码保持一致，保证测试阶段也能从同一离线 jar 生成 Lombok 代码。
    testAnnotationProcessor files(rootProject.file('cache/cache-jars/lombok-1.18.38.jar'))
}

application {
    // 明确 uniauth 启动类，保证 run 任务和后续脚本都指向统一入口。
    mainClass = 'com.sp.selplat.uniauth.UniauthBackendApplication'
}

jacoco {
    // 覆盖工具版本固定在支持当前 Java 21 字节码的稳定版本，保证本机和 CI 报告口径一致。
    toolVersion = '0.8.13'
}

tasks.named('test') {
    // 每次执行 Uniauth 测试后自动生成覆盖报告，让真实 Case 和覆盖结果始终来自同一轮执行。
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    // 覆盖报告必须等待真实测试执行完成后再读取执行数据。
    dependsOn tasks.named('test')
    reports {
        // XML 报告供自动覆盖核对和后续 CI 阈值使用。
        xml.required = true
        // HTML 报告供人工审核具体未覆盖方法和分支。
        html.required = true
        // CSV 不作为当前工程验收入口，避免生成重复覆盖产物。
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    // 覆盖门禁必须基于当前轮真实测试产生的执行数据。
    dependsOn tasks.named('test')
    violationRules {
        // 用户业务执行类逐类要求行覆盖率 100%，避免整体平均值掩盖某个公开入口未测试。
        rule {
            // CLASS 级门禁让 Controller、ServiceImpl 和 DaoImpl 各自独立满足阈值。
            element = 'CLASS'
            // 纯实体、接口和启动 main 不属于当前用户业务执行覆盖口径。
            includes = [
                'com.sp.selplat.uniauth.user.controller.UniauthUserController',
                'com.sp.selplat.uniauth.user.service.impl.UniauthUserServiceImpl',
                'com.sp.selplat.uniauth.user.dao.UniauthUserDaoImpl'
            ]
            limit {
                // 行覆盖率必须达到完整执行。
                counter = 'LINE'
                // COVEREDRATIO 直接使用 JaCoCo 实际覆盖比例。
                value = 'COVEREDRATIO'
                // 1.0 表示每个纳入范围的生产类均要求 100% 行覆盖。
                minimum = 1.0
            }
        }
        // 用户服务包含真实参数分支，单独要求所有分支均由有意义 Case 覆盖。
        rule {
            // CLASS 级门禁只检查当前业务编排实现。
            element = 'CLASS'
            // ServiceImpl 是用户模块当前唯一包含业务分支的生产执行类。
            includes = ['com.sp.selplat.uniauth.user.service.impl.UniauthUserServiceImpl']
            limit {
                // 分支覆盖率必须达到完整执行。
                counter = 'BRANCH'
                // COVEREDRATIO 使用真实分支执行比例。
                value = 'COVEREDRATIO'
                // 1.0 表示所有可达业务分支均要求 100% 覆盖。
                minimum = 1.0
            }
        }
    }
}

tasks.named('check') {
    // 标准检查任务必须执行覆盖门禁，避免本地测试通过但漏掉业务方法覆盖缺口。
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
