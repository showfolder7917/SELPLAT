plugins {
    // 当前离线环境优先保证 Java 应用可编译可运行，因此用 application 插件提供统一启动入口。
    id 'application'
}

// 本地离线 jar 目录统一收口 Spring Boot、MyBatis 和测试依赖，保证无网环境下 backend 也能稳定导入。
def localCacheJarDir = rootProject.file('localrepository/cache-jars')

dependencies {
    // uniauth 后端依赖公共核心库，复用通用值处理等基础能力。
    implementation project(':shared:backend:common-core')
    // uniauth 后端依赖公共 Web 层，供业务控制器复用 BaseController 和 MVC 参数解析能力。
    implementation project(':shared:backend:common-web')
    // uniauth 后端依赖公共服务层，统一服务接口和实现类的继承结构。
    implementation project(':shared:backend:common-service')
    // uniauth 后端依赖公共数据库层，复用 BaseDao 与 BaseTemplateDao 等模板能力。
    implementation project(':shared:backend:common-db')
    // Web Starter 负责把 controller 暴露成 HTTP 接口。
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    // JDBC Starter 负责本地 H2 数据源和事务边界。
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"
    // MyBatis Starter 负责 DAO 接口、Mapper XML 和 Spring 容器桥接。
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"
    // Lombok 负责为 final 字段生成构造器，标准坐标保证 Windows 与 macOS 共用同一套 Gradle 解析链。
    compileOnly 'org.projectlombok:lombok:1.18.38'
    // 注解处理器与编译依赖使用同一版本，确保构造器等代码在 Java 21 编译阶段稳定生成。
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    // H2 作为本地运行和最小联调数据库。
    runtimeOnly "com.h2database:h2:${h2Version}"
    // DevTools 负责在本地开发时监听 classpath 变化并触发应用重启，配合 VS Code 自动编译实现源码保存后自动重载。
    runtimeOnly "org.springframework.boot:spring-boot-devtools:${springBootVersion}"
    // Spring Boot 测试套件为后续控制层和服务层测试预留统一入口。
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    // 显式对齐 JUnit Platform 启动器，避免本地离线依赖中的 launcher 与 Jupiter 引擎版本不一致而无法发现控制器测试。
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    // 测试源码沿用同一 Lombok 坐标，避免主源码和测试源码在不同机器上出现依赖口径分裂。
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    // 测试注解处理器与主源码保持一致，保证测试阶段也能生成相同的辅助代码。
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}

application {
    // 明确 uniauth 启动类，保证 run 任务和后续脚本都指向统一入口。
    mainClass = 'com.sp.selplat.uniauth.UniauthBackendApplication'
}
