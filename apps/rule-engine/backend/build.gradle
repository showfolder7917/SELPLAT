plugins {
    // application 插件为规则引擎后端提供统一的 Gradle run 入口。
    id 'application'
}

dependencies {
    // Rule Engine 使用明确的 Spring Boot 基础坐标，版本统一复用根工程离线可用版本。
    implementation "org.springframework.boot:spring-boot-starter:${springBootVersion}"
    // MyBatis 与平台其他后端模块保持同一 Starter 版本，离线传递包继续由根 cache 的统一 JAR 集合提供。
    implementation("org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}") {
        // Starter 元数据引用旧 Spring Boot JDBC 3.4.0，关闭传递解析以避免与工程统一的 3.5.0 口径冲突。
        transitive = false
    }
    // 中文教学的 JSON 内容读取使用离线缓存中统一的 Jackson 注解版本。
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    // 中文教学内容仓库和清单导出直接使用 ObjectMapper，因此显式声明 Databind。
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    // 中文教学 DOCX 解析和渲染直接使用 POI 公共模型与文件系统能力。
    implementation "org.apache.poi:poi:${poiVersion}"
    // 中文教学 DOCX 工具直接使用 XWPF 和 OOXML 类型，因此显式声明 POI OOXML。
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"
    // 拼音生成使用 Houbb Pinyin 产生候选拼音，版本遵循中文教学既有规则约定。
    implementation "com.github.houbb:pinyin:${pinyinVersion}"
    // 规则工具只从工程根离线依赖目录取包，禁止在源码目录维护独立 lib。
    implementation fileTree(dir: rootProject.file('cache/cache-jars'), include: ['*.jar'])
}

application {
    // 所有命令行、VS Code 和脚本运行入口统一指向规则引擎后端启动类。
    mainClass = 'com.sp.selplat.local.code.common.RuleEngineBackendApplication'
}
