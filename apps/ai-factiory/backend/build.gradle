plugins {
    id 'application'
}

group = 'com.sp.selplat.aifactory'

dependencies {
    runtimeOnly project(':shared:frontend:sel-ui')
    implementation project(':shared:backend:common-core')
    implementation project(':shared:backend:common-web')
    implementation project(':shared:backend:common-service')
    implementation project(':shared:backend:common-db')
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"
    runtimeOnly "com.h2database:h2:${h2Version}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
}

application {
    mainClass = 'com.sp.selplat.aifactory.AiFactoryBackendApplication'
}

tasks.named('processResources') {
    from('../db/sql') {
        include '*.sql'
        include 'load-order.txt'
        into 'db/aifactory/sql'
    }
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('installDist') {
    // 独立控制面分发目录中的共享 Spring 依赖只保留一份，保证正式启动脚本可以生成。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distZip') {
    // 压缩分发包与 installDist 使用同一依赖去重策略，便于隔离目录启动验证。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distTar') {
    // Linux/macOS 分发包同样只保留一份共享依赖，避免不同打包入口行为漂移。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
