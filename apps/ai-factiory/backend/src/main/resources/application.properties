# AI 工厂正式库由应用私有 Hikari 连接池打开，路径与中央登记保持一致。
ai-factory.datasource.jdbc-url=jdbc:h2:file:./apps/ai-factiory/db/ai-factiory;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=false
ai-factory.datasource.pool-name=AiFactoryPool
