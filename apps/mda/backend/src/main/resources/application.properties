server.port=8082

spring.application.name=selplat-mda-backend
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./db/mda;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mda.sql
spring.sql.init.data-locations=classpath:data-mda.sql

mybatis.configuration.map-underscore-to-camel-case=true
mda.secret-key=${MDA_SECRET_KEY:selplat-mda-local-development-key}
