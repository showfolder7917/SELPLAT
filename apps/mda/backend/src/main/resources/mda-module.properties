# MDA 永久控制库直接绑定 Hikari 官方参数；JDBC URL 留空时固定解析到 apps/mda/db/mda.mv.db。
mda.control.datasource.jdbc-url=
mda.control.datasource.pool-name=MdaControlPool
mda.control.datasource.username=sa
mda.control.datasource.password=123456
mda.control.datasource.driver-class-name=org.h2.Driver
mda.control.datasource.minimum-idle=1
mda.control.datasource.maximum-pool-size=4
mda.control.datasource.connection-timeout=10000
mda.control.datasource.idle-timeout=300000
mda.control.datasource.max-lifetime=1800000

# 每个运行时目标数据库连接配置使用独立小池，闲置后释放整个池。
mda.target.pool.minimum-idle=0
mda.target.pool.maximum-pool-size=3
mda.target.pool.connection-timeout-ms=10000
mda.target.pool.idle-timeout-ms=300000
mda.target.pool.max-lifetime-ms=1800000
mda.target.pool.registry-idle-timeout-ms=900000
mda.target.pool.cleanup-interval-ms=60000
mda.target.pool.metadata-cache-timeout-ms=60000
