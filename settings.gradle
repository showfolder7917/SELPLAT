rootProject.name = 'SELPLAT'

// SELPLAT 的依赖解析必须只使用工程内既有缓存，命令行和 VS Code 导入均禁止隐式联网补包。
gradle.startParameter.offline = false

// 先按蓝图把公共核心库纳入根构建，供业务模块统一依赖。
include('shared:backend:common-core')
// 公共服务层提供业务 service 统一继承入口，先以最小空壳模块接入根构建。
include('shared:backend:common-service')
// 公共 Web 层提供控制器基类和 MVC 参数解析能力，供业务模块统一复用。
include('shared:backend:common-web')
// 当前 uniauth 已依赖 common-db，因此把公共数据库层一并纳入最小可编译范围。
include('shared:backend:common-db')
// 第一阶段业务模块先接入 uniauth backend，后续再逐步扩展其他业务域。
include('apps:uniauth:backend')
// 规则引擎后端作为独立 Java 应用接入根构建，支持统一编译、运行和 IDE 导入。
include('apps:rule-engine:backend')
// TRS 旧站迁移后的独立本地应用单独接入根构建，避免复用其他业务应用的数据源和启动配置。
include('apps:trs:backend')
// TRS 的历史 JSP 与 javax.servlet 体系需要独立的兼容容器，不能与 Spring Boot 3 的 jakarta.servlet 容器混用。
include('apps:trs:legacy-server')

// 显式绑定物理目录，避免多层级 Gradle 项目在 IDE 和命令行下解析漂移。
project(':shared:backend:common-core').projectDir = file('shared/backend/common-core')
project(':shared:backend:common-service').projectDir = file('shared/backend/common-service')
project(':shared:backend:common-web').projectDir = file('shared/backend/common-web')
project(':shared:backend:common-db').projectDir = file('shared/backend/common-db')
project(':apps:uniauth:backend').projectDir = file('apps/uniauth/backend')
project(':apps:rule-engine:backend').projectDir = file('apps/rule-engine/backend')
// TRS 后端物理目录固定在 apps/trs/backend，供 Gradle、VS Code 和启动脚本使用同一项目模型。
project(':apps:trs:backend').projectDir = file('apps/trs/backend')
// JSP 容器物理目录固定在 apps/trs/legacy-server，使 TRS 可在同一应用目录下独立构建和启动。
project(':apps:trs:legacy-server').projectDir = file('apps/trs/legacy-server')
