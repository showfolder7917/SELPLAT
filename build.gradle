import groovy.json.JsonOutput

// Gradle 构建输出直接进入工程根 build，禁止增加 gradle-build 中间层或在各模块目录生成分散的 build 临时树。
def unifiedBuildRoot = layout.projectDirectory.dir('build')
// 根工程的报告和聚合任务同样使用统一构建根，保证所有中间产物可集中治理。
layout.buildDirectory.set(unifiedBuildRoot)

allprojects {
    // 平台内所有 Java 子项目统一使用同一组坐标基础信息。
    group = 'com.sp.selplat'
    version = '0.0.1-SNAPSHOT'

    repositories {
        // 离线构建优先从仓库内缓存 jar 目录取依赖，避免当前环境无法访问 Maven Central 时直接失败。
        flatDir {
            dirs rootProject.file('cache/cache-jars')
        }
        // 保留 Maven Central 的仓库身份仅用于命中 cache/gradle-user-home 中已经缓存的模块元数据；settings.gradle 已强制离线。
        mavenCentral()
    }
}

// 多级 Gradle 路径会隐式创建 apps、shared 等聚合节点，这些节点只组织子模块，不应进入 Java 项目模型。
def javaLeafProjects = subprojects.findAll { currentProject ->
    // 只有没有下级项目的叶子模块才承载源码、依赖和实际构建生命周期。
    currentProject.childProjects.isEmpty()
}

configure(javaLeafProjects) {
    // 所有叶子模块统一成 Java 工程，后续按模块职责再叠加 library 或 application 插件。
    apply plugin: 'java'
    // Checkstyle 插件先于 checkstyle 扩展配置加载，避免 VS Code 导入 Gradle 时在脚本评估阶段找不到该扩展。
    apply plugin: 'checkstyle'
    // 把每个子项目的构建输出统一收口到 build/<项目路径>，避免模块内外散落 build 产物。
    layout.buildDirectory.set(
        unifiedBuildRoot.dir(project.path.substring(1).replace(':', '/'))
    )

    dependencies {
        // 离线 jar 目录不提供 Maven 元数据，因此这里把缓存中的所有 jar 兜底加入编译类路径，补齐传递依赖。
        compileOnly fileTree(dir: rootProject.file('cache/cache-jars'), include: ['*.jar'])
        // 单元测试在离线模式下同样需要这些本地缓存 jar，避免 testCompileClasspath 因缺少传递依赖而失败。
        testImplementation fileTree(dir: rootProject.file('cache/cache-jars'), include: ['*.jar'])
        // 测试运行期继续复用同一批缓存 jar，保证 build 阶段执行测试时也不触发在线解析。
        testRuntimeOnly fileTree(dir: rootProject.file('cache/cache-jars'), include: ['*.jar'])
    }

    pluginManager.withPlugin('jacoco') {
        dependencies {
            // flatDir 不提供 POM 传递依赖，因此所有覆盖模块统一显式补齐 JaCoCo 离线工具闭包。
            jacocoAgent "org.jacoco:org.jacoco.agent:${jacocoVersion}"
            jacocoAnt "org.jacoco:org.jacoco.ant:${jacocoVersion}"
            jacocoAnt "org.jacoco:org.jacoco.core:${jacocoVersion}"
            jacocoAnt "org.jacoco:org.jacoco.report:${jacocoVersion}"
            jacocoAnt "org.ow2.asm:asm:${asmVersion}"
            jacocoAnt "org.ow2.asm:asm-commons:${asmVersion}"
            jacocoAnt "org.ow2.asm:asm-tree:${asmVersion}"
        }
    }

    java {
        toolchain {
            // 所有子项目统一锁到 Java 21，满足本轮版本调整要求。
            languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
        }
        // 显式声明源码和目标版本，保证 VS Code 的 Java Language Server 与 Gradle 使用同一套 21 版本语义。
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        // 显式声明目标字节码版本，避免 IDE 在运行按钮启动时按其它默认版本推断编译参数。
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        // Java 源码统一按 UTF-8 编译，避免 Windows 环境出现中文注释乱码。
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        // 测试统一走 JUnit Platform，为后续 Spring Boot 测试接入留统一入口。
        useJUnitPlatform()
    }

    checkstyle {
        // Checkstyle 统一读取根目录规则文件，保证多模块在本地和 CI 下的校验口径一致。
        configFile = rootProject.file('checkstyle.xml')
        // 规则文件本身已经声明 UTF-8，因此这里继续显式对齐编码，避免 Windows 下中文注释校验乱码。
        configProperties = [charset: 'UTF-8']
    }

    tasks.withType(Checkstyle).configureEach {
        // 离线模式下当前仓库没有 Checkstyle 引擎缓存，直接跳过静态检查以保证本地编译链可验证。
        enabled = !gradle.startParameter.isOffline()
        // Checkstyle 报告统一开启 HTML，方便在 IDE 或浏览器里直接查看具体违规位置。
        reports {
            xml.required = true
            html.required = true
        }
    }
}

// sharedRegression 统一执行所有 shared 后端模块测试、覆盖门禁和标准检查，作为公共能力完整回归入口。
tasks.register('sharedRegression') {
    // 公共核心当前没有测试源码，但仍执行 test 保持未来新增用例自动进入回归。
    dependsOn ':shared:backend:common-core:test'
    // common-db check 包含真实 H2 DAO 测试和 BaseDaoImpl 100% 行覆盖门禁。
    dependsOn ':shared:backend:common-db:check'
    // common-service check 包含真实号段测试、算法边界和 SequenceGeneratorImpl 100% 行覆盖门禁。
    dependsOn ':shared:backend:common-service:check'
    // common-web check 包含公共参数、路径、响应测试和 BaseExtendsController 100% 行覆盖门禁。
    dependsOn ':shared:backend:common-web:check'
}

// Python 启动器允许本机或 CI 通过 -PselplatPython / SELPLAT_PYTHON 显式覆盖，工程内不保存机器绝对路径。
def selplatPythonCommand = {
    String configuredPython = providers.gradleProperty('selplatPython')
            .orElse(providers.environmentVariable('SELPLAT_PYTHON'))
            .getOrElse('')
            .trim()
    if (!configuredPython.isEmpty()) {
        return [configuredPython]
    }
    // Windows 优先使用系统 Python Launcher；macOS 与 Linux 使用标准 python3 命令。
    return System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
            ? ['py', '-3']
            : ['python3']
}

// 全部门禁 Python 统一把字节码缓存写入工程 cache，禁止污染 main 与 test 源码树。
def selplatPythonCacheRoot = layout.projectDirectory.dir('cache/python-pycache').asFile.absolutePath
// 快速门禁直接运行生产源码归属扫描器，不启动 Spring 或连接正式业务数据库。
def selplatQuickGateScript = file(
        'apps/rule-engine/backend/src/main/python/com/sp/selplat/local/code/XUNAN/abilities/'
                + 'selplat_source_ownership_guard.py')
// Python 规则测试使用唯一统一入口，scope 参数决定当前用户专项或全部规则回归。
def selplatRuleTestScript = file('apps/rule-engine/backend/src/test/python/run_tests.py')
// 执行文档统一通过 core executor 调用登记能力，Gradle 不直接导入或复制 Python 内务实现。
def selplatAbilityExecutorScript = file(
        'apps/rule-engine/backend/src/main/python/com/sp/selplat/local/code/core/executor.py')
// 每个任务生命周期动作都保留结构化 JSON，便于执行器和测试稳定识别 begin、step、active、ready、finish。
def selplatExecutionDocumentCommand = { String action ->
    String contextJson = JsonOutput.toJson([action: action])
    // Windows CreateProcess 会消费未转义的 JSON 双引号；只在 Windows 保留字面引号供 Python 解析。
    String contextArgument = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
            ? contextJson.replace('"', '\\"')
            : contextJson
    return selplatPythonCommand() + [
        selplatAbilityExecutorScript.absolutePath,
        'execution_doc_manager',
        contextArgument
    ]
}

// 测试文档与执行文档使用同一线程来源，但生命周期独立，待测清单可以跨多次修改持续保留。
def selplatTestDocumentCommand = { String action ->
    String contextJson = JsonOutput.toJson([action: action])
    String contextArgument = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
            ? contextJson.replace('"', '\\"')
            : contextJson
    return selplatPythonCommand() + [
        selplatAbilityExecutorScript.absolutePath,
        'test_doc_manager',
        contextArgument
    ]
}

tasks.register('selplatTaskDocumentActiveGate', Exec) {
    group = 'verification'
    description = '阻断没有独立 1、真实目标和执行步骤的当前线程任务。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        // 快速、专项和全量门禁共用当前 Codex 线程，不允许用其他页面的文档代替本轮授权。
        commandLine(selplatExecutionDocumentCommand('active'))
    }
}

tasks.register('selplatQuickGateCore', Exec) {
    group = 'verification'
    description = '执行不依赖任务授权状态的 SELPLAT 快速静态门禁。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        // 当前机器 Python 启动器 + 唯一生产门禁程序 → 零违规时任务成功，任一违规立即阻断。
        commandLine(selplatPythonCommand() + [selplatQuickGateScript.absolutePath])
    }
}

tasks.register('selplatQuickGate') {
    group = 'verification'
    description = '开发过程中主动运行快速门禁；开始前核验当前执行文档授权。'
    dependsOn 'selplatTaskDocumentActiveGate', 'selplatQuickGateCore'
}

tasks.register('selplatActiveUserRuleTests', Exec) {
    group = 'verification'
    description = '运行当前稳定用户规则和源码门禁自动化测试。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        // 当前用户测试范围从 AGENTS.md 动态解析，禁止在 Gradle 中写死用户目录。
        commandLine(selplatPythonCommand() + [selplatRuleTestScript.absolutePath, 'active-user'])
    }
}

tasks.register('selplatAllRuleTests', Exec) {
    group = 'verification'
    description = '运行 core 与当前稳定用户的全部规则引擎 Python 测试。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        // all 范围由统一测试入口组合 core 与当前用户，避免 Gradle 扫描用户目录自行推断身份。
        commandLine(selplatPythonCommand() + [selplatRuleTestScript.absolutePath, 'all'])
    }
}

// Gradle 已登记的 apps/<项目>/backend 叶子模块 → 专项门禁的动态项目事实来源。
def selplatApplicationGateProjects = javaLeafProjects.findAll { currentProject ->
    List<String> pathParts = currentProject.path.tokenize(':')
    return pathParts.size() == 3 && pathParts[0] == 'apps' && pathParts[2] == 'backend'
}.collectEntries { currentProject ->
    List<String> pathParts = currentProject.path.tokenize(':')
    return [(pathParts[1]): currentProject]
}
// shared 使用聚合回归入口；apps 范围完全来自 settings.gradle 当前项目模型，不再维护静态应用名称。
def selplatKnownGateScopes = new LinkedHashSet<>(selplatApplicationGateProjects.keySet())
selplatKnownGateScopes.add('shared')

// 专项门禁支持显式 scope，也支持从调用方提供的工程相对变更文件推导；没有范围时安全回退为全部模块。
def selplatRequestedGateScopes = {
    Set<String> scopes = new LinkedHashSet<>()
    String explicitScopes = providers.gradleProperty('selplatGateScope')
            .orElse(providers.environmentVariable('SELPLAT_GATE_SCOPE'))
            .getOrElse('')
    explicitScopes.split(/[,;\s]+/).findAll { !it.isBlank() }.each { scopes.add(it.trim()) }

    String changedFiles = providers.gradleProperty('selplatGateFiles')
            .orElse(providers.environmentVariable('SELPLAT_GATE_FILES'))
            .getOrElse('')
    changedFiles.split(/[,;\r\n]+/).findAll { !it.isBlank() }.each { rawPath ->
        String relativePath = rawPath.trim().replace('\\', '/')
        String matchedScope = selplatKnownGateScopes.find { scope ->
            relativePath.startsWith("apps/${scope}/")
        }
        if (relativePath.startsWith('shared/')) {
            matchedScope = 'shared'
        }
        if (matchedScope == null) {
            // 根构建、规则索引或未知公共文件可能影响所有模块 → 禁止因无法分类而漏跑专项测试。
            scopes.addAll(selplatKnownGateScopes)
        } else {
            scopes.add(matchedScope)
        }
    }
    if (scopes.isEmpty() || scopes.remove('all')) {
        scopes.addAll(selplatKnownGateScopes)
    }
    Set<String> unknownScopes = scopes.findAll { !selplatKnownGateScopes.contains(it) } as Set
    if (!unknownScopes.isEmpty()) {
        throw new GradleException("未知 SELPLAT 专项门禁范围: ${unknownScopes.sort().join(', ')}")
    }
    return scopes
}

// 每个已登记应用自动映射自己的 test；新增 settings 模块后下一次 Gradle 启动即进入专项门禁。
def selplatSpecialGateTaskPaths = selplatApplicationGateProjects.collectEntries { scope, currentProject ->
    return [(scope): ["${currentProject.path}:test"]]
}
// rule-engine 除 Java 测试外还必须执行当前稳定用户 Python 规则测试。
if (selplatSpecialGateTaskPaths.containsKey('rule-engine')) {
    selplatSpecialGateTaskPaths['rule-engine'].add('selplatActiveUserRuleTests')
}
// shared 保持后端聚合回归和公共前端边界检查，不伪装成 apps 项目。
selplatSpecialGateTaskPaths['shared'] = [
        'sharedRegression', ':shared:frontend:sel-ui:verifySelUiSourceBoundary'
]

tasks.register('selplatSpecialGate') {
    group = 'verification'
    description = '按 -PselplatGateScope 或 -PselplatGateFiles 运行相关模块专项测试；未指定时运行全部范围。'
    dependsOn 'selplatQuickGate'
    Set<String> selectedScopes = selplatRequestedGateScopes()
    dependsOn selectedScopes.collectMany { selplatSpecialGateTaskPaths[it] }.unique()
    doFirst {
        // 最终选择范围显式输出，便于开发者和 AI 核对本次专项测试没有遗漏模块。
        logger.lifecycle("SELPLAT 专项门禁范围: ${selectedScopes.sort().join(', ')}")
    }
}

tasks.register('selplatTaskDocumentReadyGate', Exec) {
    group = 'verification'
    description = '根交付前检查当前线程执行文档的全部步骤已经回写真实结果。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        // ready 只检查不归档，后续完整门禁失败时仍保留当前文档供继续修正。
        commandLine(selplatExecutionDocumentCommand('ready'))
    }
}

tasks.register('selplatTestDocumentPendingGate', Exec) {
    group = 'verification'
    description = '确认当前线程已经登记至少一个待统一测试项。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        commandLine(selplatTestDocumentCommand('pending'))
    }
}

tasks.register('selplatFullGate') {
    group = 'verification'
    description = '用户触发统一测试时运行全部 Java 检查、前端边界检查和规则测试。'
    dependsOn 'selplatTestDocumentPendingGate', 'selplatQuickGateCore', 'selplatAllRuleTests'
    // 所有 Java 叶子模块进入 check；后续 settings 新增叶子模块会自动纳入，无需维护静态清单。
    dependsOn javaLeafProjects.collect { currentProject -> "${currentProject.path}:check" }
    dependsOn ':shared:frontend:sel-ui:verifySelUiSourceBoundary'
}

tasks.register('selplatTaskDocumentFinishGate', Exec) {
    group = 'verification'
    description = '执行步骤完成且待测项已登记后归档执行文档，不自动启动测试。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    dependsOn 'selplatTaskDocumentReadyGate', 'selplatTestDocumentPendingGate'
    doFirst {
        // finish 再次核验 ready 后归档；中途失败不会清空当前任务记录。
        commandLine(selplatExecutionDocumentCommand('finish'))
    }
}


tasks.register('selplatTestDocumentReadyGate', Exec) {
    group = 'verification'
    description = '统一测试完成后确认测试文档没有待测试或失败项。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    doFirst {
        commandLine(selplatTestDocumentCommand('ready'))
    }
}

tasks.register('selplatTestDocumentFinishGate', Exec) {
    group = 'verification'
    description = '全部统一测试结果通过后归档当前线程测试文档。'
    workingDir rootProject.projectDir
    environment 'PYTHONPYCACHEPREFIX', selplatPythonCacheRoot
    environment 'PYTHONIOENCODING', 'utf-8'
    dependsOn 'selplatTestDocumentReadyGate'
    doFirst {
        commandLine(selplatTestDocumentCommand('finish'))
    }
}

// 根 check 只在用户明确触发统一测试时运行，不再负责每次修改后的执行文档归档。
tasks.register('check') {
    group = 'verification'
    description = 'SELPLAT 手动统一测试入口：执行当前测试文档对应的全量工程门禁。'
    dependsOn 'selplatFullGate'
}
