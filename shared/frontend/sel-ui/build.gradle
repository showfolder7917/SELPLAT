import groovy.json.JsonSlurper

plugins {
    // sel-ui 以标准资源 JAR 参与 Gradle 依赖，不引入第二套独立构建入口。
    id 'java-library'
}

tasks.named('processResources') {
    // 公共源码按 Spring Boot 依赖 JAR 的标准静态资源位置发布，运行时 URL 固定为 /sel/**。
    from('src') {
        include 'README.md'
        include 'core/**'
        include 'components/**'
        include 'theme/**'
        include 'assets/**'
        include 'vendor/**'
        into 'META-INF/resources/sel'
    }
}

tasks.register('verifySelUiSourceBoundary') {
    // 边界检查直接读取权威源码，不检查 build 中可以删除和重建的资源副本。
    inputs.files(fileTree('src') {
        include '**/*.js'
        include '**/*.css'
        include '**/*.json'
    })

    doLast {
        // 公共运行时不得识别 Uniauth 实体、接口或应用挂载点，避免共享组件重新绑定单一业务。
        def forbiddenPatterns = [
            ~/Uniauth/,
            ~/\/api\/uniauth\//,
            ~/data-uniauth-/,
            ~/mock\/Uniauth/
        ]
        def violations = []
        inputs.files.files.sort().each { sourceFile ->
            def sourceText = sourceFile.getText('UTF-8')
            forbiddenPatterns.each { forbiddenPattern ->
                if (sourceText =~ forbiddenPattern) {
                    violations.add("${project.relativePath(sourceFile)} -> ${forbiddenPattern}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "sel-ui 公共源码包含应用业务语义：\n" + violations.join('\n')
            )
        }
        // 统一文字门禁要求七级语义字号、配套字重/行高和树层级契约同时存在，并禁止旧两档令牌回流。
        def tokenFile = file('src/theme/selThemeTokens.css')
        def typographyFile = file('src/theme/selThemeTypography.css')
        def treeScriptFile = file('src/components/tree/selTree.js')
        if (!tokenFile.isFile() || !typographyFile.isFile() || !treeScriptFile.isFile()) {
            throw new GradleException('sel-ui 缺少统一文字令牌、排版契约或树控件权威源文件')
        }
        def tokenSource = tokenFile.getText('UTF-8')
        def typographySource = typographyFile.getText('UTF-8')
        def treeSource = treeScriptFile.getText('UTF-8')
        def typographyViolations = []
        ['display', 'title', 'heading', 'body', 'label', 'caption', 'micro'].each { role ->
            if (!tokenSource.contains("--sel-theme-font-size-${role}:")) {
                typographyViolations.add("selThemeTokens.css -> 缺少 ${role} 字号")
            }
        }
        ['regular', 'medium', 'semibold', 'bold'].each { weight ->
            if (!tokenSource.contains("--sel-theme-font-weight-${weight}:")) {
                typographyViolations.add("selThemeTokens.css -> 缺少 ${weight} 字重")
            }
        }
        ['heading', 'body', 'label', 'caption'].each { role ->
            if (!typographySource.contains(".seltree-node-text-${role} .seltree-node-label")) {
                typographyViolations.add("selThemeTypography.css -> 缺少树节点 ${role} 角色")
            }
        }
        ['database: "heading"', 'schema: "body"', 'table: "label"', 'column: "caption"'].each { mapping ->
            if (!treeSource.contains(mapping)) {
                typographyViolations.add("selTree.js -> 缺少 ${mapping} 映射")
            }
        }
        def typographyGovernedFiles = [] as Set
        typographyGovernedFiles.addAll(fileTree('src') { include '**/*.css'; include '**/*.js' }.files)
        typographyGovernedFiles.addAll(rootProject.fileTree('apps') {
            include '*/backend/src/main/resources/static/**/*.css'
            include '*/backend/src/main/resources/static/**/*.js'
        }.files)
        typographyGovernedFiles.sort().each { sourceFile ->
            def sourceText = sourceFile.getText('UTF-8')
            ['--sel-theme-font-size-primary', '--sel-theme-font-size-secondary'].each { legacyToken ->
                if (sourceText.contains(legacyToken)) {
                    typographyViolations.add("${rootProject.relativePath(sourceFile)} -> 禁止旧令牌 ${legacyToken}")
                }
            }
        }
        if (!typographyViolations.isEmpty()) {
            throw new GradleException("sel-ui 统一文字治理门禁失败：\n" + typographyViolations.join('\n'))
        }
        // 页面编辑器与 Grid 的公共适配契约必须成对存在，应用只能登记坐标和保存回调。
        def personalizationSource = file('src/components/personalization/selPersonalization.js').getText('UTF-8')
        def personalizationStyle = file('src/components/personalization/selPersonalization.css').getText('UTF-8')
        def pageEditorGridSource = file('src/components/grid/selGrid.js').getText('UTF-8')
        def pageEditorGridStyle = file('src/components/grid/selGrid.css').getText('UTF-8')
        def pageEditorWindowSource = file('src/components/window/selWindow.js').getText('UTF-8')
        def pageEditorWindowStyle = file('src/components/window/selWindow.css').getText('UTF-8')
        def pageEditorViolations = []
        [
            'registerPageControl: selPersonalizationRegisterPageControl',
            'updatePageControl: selPersonalizationUpdatePageControl',
            'setPageMode: selPersonalizationSetPageMode',
            'typeof selPersonalizationDefinition.onEdit === "function"',
            'actionOnly: selPersonalizationPageControlActionOnly',
            'enabled: selPersonalizationDefinition.enabled !== false',
            'Array.isArray(selPersonalizationDefinition.roots)',
            'Array.isArray(selPersonalizationDefinition.editHosts)',
            'data-sel-personal-page-edit-switch',
            'role="switch"',
            'selPersonalizationPageEditSwitch.checked = selPersonalizationEditing',
            '<span>保存${selPersonalizationPageControl.typeLabel}</span>'
        ].each { contract ->
            if (!personalizationSource.contains(contract)) pageEditorViolations.add("selPersonalization.js -> 缺少 ${contract}")
        }
        ['selpersonal-page-edit-switch', 'selpersonal-page-control-edit'].each { selector ->
            if (!personalizationStyle.contains(".${selector}")) pageEditorViolations.add("selPersonalization.css -> 缺少 ${selector}")
        }
        if (!personalizationStyle.contains('--selpersonal-page-edit-accent: var(--sel-theme-semantic-warning)')) {
            pageEditorViolations.add('selPersonalization.css -> 页面编辑按钮缺少专属强调色')
        }
        ['data-sel-personal-page-actions', 'data-sel-personal-page-inspector', 'savePage: selPersonalizationSavePageEditing',
         'cancelPage: selPersonalizationCancelPageEditing'].each { forbiddenContract ->
            if (personalizationSource.contains(forbiddenContract)) pageEditorViolations.add("selPersonalization.js -> 页面编辑总开关禁止 ${forbiddenContract}")
        }
        if (!pageEditorGridStyle.contains('margin-left: 0;')) {
            pageEditorViolations.add('selGrid.css -> 表格编辑按钮未紧邻数据库 code')
        }
        ['selGrid:columnResizeChange', 'captureColumnWidths:', 'setColumnWidths:', 'resetColumnWidths:', 'data-sel-grid-role="table-heading"', 'data-sel-grid-role="table-code"'].each { contract ->
            if (!pageEditorGridSource.contains(contract)) pageEditorViolations.add("selGrid.js -> 缺少 ${contract}")
        }
        ['content instanceof Element', 'showActions === false', 'selwindow-form-fields-custom', 'selwindow-actions-shell[hidden]',
         'setPageEditMetadata', 'getPageEditTarget', 'setDefaultGeometry', 'getGeometry', 'selwindow-page-edit-heading'].each { contract ->
            if (!pageEditorWindowSource.contains(contract) && !pageEditorWindowStyle.contains(contract)) {
                pageEditorViolations.add("selWindow -> 缺少 ${contract}")
            }
        }
        if (!pageEditorViolations.isEmpty()) {
            throw new GradleException("sel-ui 页面编辑公共契约门禁失败：\n" + pageEditorViolations.join('\n'))
        }
        // 多字段查询与后台分页是公共能力：Search 只发布字段值，Grid 只发布分页状态。
        def searchSource = file('src/components/search/selSearch.js').getText('UTF-8')
        def searchStyle = file('src/components/search/selSearch.css').getText('UTF-8')
        def gridQuerySource = file('src/components/grid/selGrid.js').getText('UTF-8')
        def remoteQueryViolations = []
        [
            'Array.isArray(selSearchData.fields)',
            'values: { ...selSearchValues }',
            'setValues(values = {})',
            'getValues: () =>',
            'setIndependentLayout: selSearchSetIndependentLayout',
            'getLayoutTargets: selSearchGetLayoutTargets',
            'remount(selSearchGridRoot, selSearchData)'
        ].each { contract ->
            if (!searchSource.contains(contract)) remoteQueryViolations.add("selSearch.js -> 缺少 ${contract}")
        }
        [
            '--selsearch-field-default-width: 280px',
            '--selsearch-field-min-width: 180px',
            'justify-content: start'
        ].each { contract ->
            if (!searchStyle.contains(contract)) remoteQueryViolations.add("selSearch.css -> 缺少 ${contract}")
        }
        if (!file('src/components/panel/selPanel.js').getText('UTF-8').contains(
                '!selPanelColumnState.initialized || !selPanelColumnResizeEnabled')) {
            remoteQueryViolations.add('selPanel.js -> 禁用调宽的动态模块栏目没有跟随当前装配宽度')
        }
        [
            'String(selGridPaginationData.mode || "LOCAL").toUpperCase() === "REMOTE"',
            'new CustomEvent("selGrid:queryChange"',
            'selGridUsesRemotePagination() ? selGridProjects : selGridGetVisibleProjects()',
            'values: { ...selGridState.searchValues }',
            'deferToolbarFiltersUntilSubmit === true',
            'Object.entries(selGridState.searchValues).every',
            'selGridState.type = selGridState.draftType',
            'selGridState.status = selGridState.draftStatus'
        ].each { contract ->
            if (!gridQuerySource.contains(contract)) remoteQueryViolations.add("selGrid.js -> 缺少 ${contract}")
        }
        if (!remoteQueryViolations.isEmpty()) {
            throw new GradleException("sel-ui 多字段查询与后台分页门禁失败：\n" + remoteQueryViolations.join('\n'))
        }
        // 中央登记是公共控件的唯一创建入口；新增目录、脚本或样式未登记时直接阻断。
        def registryFile = file('src/components/component-registry.json')
        if (!registryFile.isFile()) {
            throw new GradleException('sel-ui 缺少公共控件中央登记 component-registry.json')
        }
        def registry = new JsonSlurper().parse(registryFile)
        def expectedPolicy = [
            creationMode: 'register-before-implementation',
            legacyCompatibility: 'forbidden',
            applicationPrivateReusableControl: 'forbidden'
        ]
        def expectedChecks = [
            'source-boundary', 'namespaced-public-api', 'kernel-first', 'theme-contract',
            'dependency-order', 'application-private-control'
        ] as Set
        if (registry.version != 2 || registry.kernel?.script != 'core/selKernel.js'
                || registry.kernel?.publicApi != 'sel' || registry.kernel?.loadOrder != 'first'
                || !(registry.components instanceof List)
                || !(registry.policy instanceof Map)
                || expectedPolicy.any { key, value -> registry.policy[key] != value }
                || (registry.policy.requiredChecks as Set) != expectedChecks) {
            throw new GradleException('sel-ui 公共控件中央登记策略不完整或版本无效')
        }
        def kernelFile = file('src/core/selKernel.js')
        def kernelSource = kernelFile.isFile() ? kernelFile.getText('UTF-8') : ''
        [
            'function selFreeze(', 'new WeakSet()', 'Array.isArray(value)',
            'function selRegister(', 'function selRequire(',
            'selRegister("core.freeze", selFreeze)',
            'Object.defineProperty(global, "sel"'
        ].each { contract ->
            if (!kernelSource.contains(contract)) {
                throw new GradleException("selKernel.js 缺少公共内核契约：${contract}")
            }
        }
        def componentIds = [] as Set
        def registeredDirectories = [] as Set
        def registeredSources = [] as Set
        def componentById = [:]
        def registryViolations = []
        registry.components.each { component ->
            if (!(component.id ==~ /sel[A-Z][A-Za-z0-9]*/)
                    || !componentIds.add(component.id)
                    || !(component.directory ==~ /[a-z][a-z0-9-]*/)
                    || !(component.type in ['interactive', 'layout', 'presentation', 'registry'])
                    || !(component.scripts instanceof List)
                    || !(component.styles instanceof List)
                    || !(component.dependencies instanceof List)) {
                registryViolations.add("无效控件登记 -> ${component}")
                return
            }
            componentById[component.id] = component
            registeredDirectories.add(component.directory)
            def componentDirectory = file("src/components/${component.directory}")
            if (!componentDirectory.isDirectory()) {
                registryViolations.add("${component.id} -> 缺少目录 ${component.directory}")
                return
            }
            def componentApiName = component.id.substring(3, 4).toLowerCase() + component.id.substring(4)
            def expectedPublicApi = "sel.components.${componentApiName}"
            if (!component.scripts.isEmpty() && component.publicApi != expectedPublicApi) {
                registryViolations.add("${component.id} -> publicApi 必须为 ${expectedPublicApi}")
            }
            if (component.scripts.isEmpty() && component.publicApi != null) {
                registryViolations.add("${component.id} -> 纯样式控件不得声明 publicApi")
            }
            (component.scripts + component.styles).each { sourceName ->
                def sourceFile = file("src/components/${component.directory}/${sourceName}")
                if (!registeredSources.add(sourceFile.canonicalFile)) {
                    registryViolations.add("${sourceFile} -> 重复登记所有者")
                    return
                }
                if (!sourceFile.isFile()) {
                    registryViolations.add("${component.id} -> 缺少 ${sourceName}")
                    return
                }
                def sourceText = sourceFile.getText('UTF-8')
                if (sourceName.endsWith('.js')
                        && !sourceText.contains("window.sel.register(\"components.${componentApiName}\"")) {
                    registryViolations.add("${component.id} -> 未发布登记的公共 API")
                }
                if (sourceName.endsWith('.css') && component.themeAware == true
                        && !sourceText.contains('var(--sel-theme-')) {
                    registryViolations.add("${component.id} -> 未消费统一主题令牌")
                }
            }
        }
        file('src/components').listFiles().findAll { it.isDirectory() }.each { componentDirectory ->
            if (!registeredDirectories.contains(componentDirectory.name)) {
                registryViolations.add("${componentDirectory.name} -> 新控件目录未登记")
            }
            componentDirectory.listFiles().findAll {
                it.isFile() && (it.name.endsWith('.js') || it.name.endsWith('.css'))
            }.each { sourceFile ->
                if (!registeredSources.contains(sourceFile.canonicalFile)) {
                    registryViolations.add("${project.relativePath(sourceFile)} -> 控件源码未登记")
                }
            }
        }
        componentById.each { componentId, component ->
            component.dependencies.each { dependencyId ->
                if (dependencyId == componentId || !componentById.containsKey(dependencyId)) {
                    registryViolations.add("${componentId} -> 无效依赖 ${dependencyId}")
                    return
                }
                def componentSource = component.scripts.collect { sourceName ->
                    file("src/components/${component.directory}/${sourceName}").getText('UTF-8')
                }.join('\n')
                def dependencyPublicApi = componentById[dependencyId].publicApi
                if (!(dependencyPublicApi instanceof String)
                        || !componentSource.contains("window.${dependencyPublicApi}")) {
                    registryViolations.add("${componentId} -> 已登记但未调用 ${dependencyId}")
                }
            }
        }
        // 应用不得发布私有 sel<Component>、自行创建 body 门户或复写已由公共控件拥有的 ARIA 交互。
        def ownedAriaRoles = componentById.values().collectEntries { component ->
            (component.ownedAriaRoles ?: []).collectEntries { role -> [(role): component.id] }
        }
        // selFreeze 是深冻结入口；同一调用内部再次调用只会制造噪声和重复遍历，统一由边界扫描阻断。
        def hasNestedSelFreeze = { String sourceText ->
            def structural = new StringBuilder(sourceText)
            def state = 'code'
            def quote = (char) 0
            int cursor = 0
            while (cursor < sourceText.length()) {
                char current = sourceText.charAt(cursor)
                char next = cursor + 1 < sourceText.length() ? sourceText.charAt(cursor + 1) : (char) 0
                if (state == 'code' && current == '/' && next == '/') {
                    structural.setCharAt(cursor, ' ' as char)
                    structural.setCharAt(cursor + 1, ' ' as char)
                    cursor += 2
                    state = 'line-comment'
                    continue
                }
                if (state == 'code' && current == '/' && next == '*') {
                    structural.setCharAt(cursor, ' ' as char)
                    structural.setCharAt(cursor + 1, ' ' as char)
                    cursor += 2
                    state = 'block-comment'
                    continue
                }
                if (state == 'code' && (current == '\'' || current == '"' || current == '`')) {
                    quote = current
                    structural.setCharAt(cursor, ' ' as char)
                    cursor++
                    state = 'string'
                    continue
                }
                if (state == 'line-comment') {
                    if (current == '\n') state = 'code'
                    else structural.setCharAt(cursor, ' ' as char)
                    cursor++
                    continue
                }
                if (state == 'block-comment') {
                    if (current == '*' && next == '/') {
                        structural.setCharAt(cursor, ' ' as char)
                        structural.setCharAt(cursor + 1, ' ' as char)
                        cursor += 2
                        state = 'code'
                    } else {
                        if (current != '\n') structural.setCharAt(cursor, ' ' as char)
                        cursor++
                    }
                    continue
                }
                if (state == 'string') {
                    if (current == '\\') {
                        structural.setCharAt(cursor, ' ' as char)
                        if (cursor + 1 < sourceText.length()) {
                            if (next != '\n') structural.setCharAt(cursor + 1, ' ' as char)
                            cursor += 2
                        } else cursor++
                        continue
                    }
                    if (current == quote) {
                        structural.setCharAt(cursor, ' ' as char)
                        cursor++
                        state = 'code'
                    } else {
                        if (current != '\n') structural.setCharAt(cursor, ' ' as char)
                        cursor++
                    }
                    continue
                }
                cursor++
            }
            int parenthesisDepth = 0
            def activeFreezeDepths = []
            cursor = 0
            while (cursor < structural.length()) {
                if (cursor + 9 <= structural.length() && structural.substring(cursor, cursor + 9) == 'selFreeze') {
                    char before = cursor > 0 ? structural.charAt(cursor - 1) : (char) 0
                    int afterIndex = cursor + 9
                    char after = afterIndex < structural.length() ? structural.charAt(afterIndex) : (char) 0
                    def isIdentifier = { char value -> Character.isLetterOrDigit(value) || value == '_' || value == '$' }
                    if (!isIdentifier(before) && !isIdentifier(after)) {
                        int openIndex = afterIndex
                        while (openIndex < structural.length() && Character.isWhitespace(structural.charAt(openIndex))) openIndex++
                        if (openIndex < structural.length() && structural.charAt(openIndex) == '(') {
                            if (!activeFreezeDepths.isEmpty()) return true
                            parenthesisDepth++
                            activeFreezeDepths.add(parenthesisDepth)
                            cursor = openIndex + 1
                            continue
                        }
                    }
                }
                if (structural.charAt(cursor) == '(') parenthesisDepth++
                else if (structural.charAt(cursor) == ')') {
                    if (!activeFreezeDepths.isEmpty() && activeFreezeDepths.last() == parenthesisDepth) {
                        activeFreezeDepths.remove(activeFreezeDepths.size() - 1)
                    }
                    parenthesisDepth = Math.max(0, parenthesisDepth - 1)
                }
                cursor++
            }
            return false
        }
        def applicationStaticFiles = rootProject.fileTree('apps') {
            include '**/src/main/resources/static/**/*.js'
            include '**/src/main/resources/static/**/*.html'
        }
        applicationStaticFiles.files.sort().each { applicationFile ->
            def applicationText = applicationFile.getText('UTF-8')
            if (applicationFile.name.endsWith('.js')
                    && applicationText =~ /window\s*\.\s*sel[A-Z][A-Za-z0-9]*\s*=/) {
                registryViolations.add("${rootProject.relativePath(applicationFile)} -> 应用私造公共控件 API")
            }
            if (applicationFile.name.endsWith('.js')
                    && applicationText =~ /window\s*\.\s*sel[A-Z][A-Za-z0-9]*/) {
                registryViolations.add("${rootProject.relativePath(applicationFile)} -> 应用仍在读取旧式平铺 SEL API")
            }
            if (applicationFile.name.endsWith('.js') && applicationText.contains('Object.freeze')) {
                registryViolations.add("${rootProject.relativePath(applicationFile)} -> 应用必须使用 sel.core.freeze")
            }
            if (applicationFile.name.endsWith('.js') && hasNestedSelFreeze(applicationText)) {
                registryViolations.add("${rootProject.relativePath(applicationFile)} -> selFreeze 只允许在完整只读边界调用一次")
            }
            if (applicationFile.name.endsWith('.js') && applicationText.contains('window.sel.require(')) {
                def header = applicationText.readLines().take(30).join('\n')
                if (!header.contains('SEL UI') || !(header =~ /[\u4e00-\u9fff]/)) {
                    registryViolations.add(
                        "${rootProject.relativePath(applicationFile)} -> 应用文件头必须用中文说明 SEL UI 组件用途"
                    )
                }
            }
            if (applicationFile.name.endsWith('.js')
                    && applicationText.contains('document.body.appendChild')) {
                registryViolations.add("${rootProject.relativePath(applicationFile)} -> 应用私造 body 门户")
            }
            ownedAriaRoles.each { role, ownerId ->
                def rolePattern = ~/(?:(?<![-\w])role\s*=\s*[\"']${role}[\"']|setAttribute\(\s*[\"']role[\"']\s*,\s*[\"']${role}[\"'])/
                if (applicationText =~ rolePattern) {
                    registryViolations.add("${rootProject.relativePath(applicationFile)} -> role=${role} 必须使用 ${ownerId}")
                }
            }
        }
        // 每份应用页面和生成模板都按登记依赖自动检查资源存在性与加载顺序，新控件无需再手写专项门禁。
        def dependencyDocuments = [] as Set
        dependencyDocuments.addAll(applicationStaticFiles.files.findAll { it.name.endsWith('.html') })
        dependencyDocuments.addAll(rootProject.fileTree('apps') {
            include '*/backend/src/main/java/**/*.java'
        }.files)
        dependencyDocuments.sort().each { documentFile ->
            def documentText = documentFile.getText('UTF-8')
            if (documentFile.name.endsWith('.java')) {
                def textBlockMatcher = documentText =~ /(?s)"""(.*?)"""/
                while (textBlockMatcher.find()) {
                    if (hasNestedSelFreeze(textBlockMatcher.group(1))) {
                        registryViolations.add("${rootProject.relativePath(documentFile)} -> 生成脚本禁止嵌套 selFreeze")
                        break
                    }
                }
            }
            def kernelResource = '/sel/core/selKernel.js'
            def firstSelScriptMatcher = documentText =~ /<script[^>]+src=["'](\/sel\/(?:core|theme|components)\/[^"']+\.js)[^"']*["']/
            if (firstSelScriptMatcher.find()) {
                def firstSelScript = firstSelScriptMatcher.group(1)
                if (!documentText.contains(kernelResource)
                        || documentText.indexOf(kernelResource) > documentText.indexOf(firstSelScript)) {
                    registryViolations.add(
                        "${rootProject.relativePath(documentFile)} -> selKernel.js 必须先于全部 SEL 脚本加载"
                    )
                }
            }
            componentById.each { componentId, component ->
                def ownResourcesByKind = [
                    styles: component.styles.collect { "/sel/components/${component.directory}/${it}" },
                    scripts: component.scripts.collect { "/sel/components/${component.directory}/${it}" }
                ]
                if (!ownResourcesByKind.values().flatten().any { documentText.contains(it) }) return
                component.dependencies.each { dependencyId ->
                    def dependency = componentById[dependencyId]
                    def missing = []
                    def late = []
                    ['styles', 'scripts'].each { resourceKind ->
                        def presentOwnResources = ownResourcesByKind[resourceKind].findAll {
                            documentText.contains(it)
                        }
                        def dependencyResources = dependency[resourceKind].collect {
                            "/sel/components/${dependency.directory}/${it}"
                        }
                        missing.addAll(dependencyResources.findAll { !documentText.contains(it) })
                        if (!presentOwnResources.isEmpty()) {
                            def firstOwnIndex = presentOwnResources.collect {
                                documentText.indexOf(it)
                            }.min()
                            late.addAll(dependencyResources.findAll {
                                documentText.contains(it) && documentText.indexOf(it) > firstOwnIndex
                            })
                        }
                    }
                    if (!missing.isEmpty() || !late.isEmpty()) {
                        registryViolations.add(
                            "${rootProject.relativePath(documentFile)} -> ${componentId} 依赖 ${dependencyId}，缺少=${missing}，顺序错误=${late}"
                        )
                    }
                }
            }
        }
        // 只有内核可以调用原生冻结；其他 shared 脚本必须走同一深度冻结入口，并且不得回流平铺全局 API。
        fileTree('src') {
            include '**/*.js'
            exclude 'core/selKernel.js'
        }.files.sort().each { sourceFile ->
            def sourceText = sourceFile.getText('UTF-8')
            if (sourceText.contains('Object.freeze')) {
                registryViolations.add("${project.relativePath(sourceFile)} -> shared 必须使用 sel.core.freeze")
            }
            if (hasNestedSelFreeze(sourceText)) {
                registryViolations.add("${project.relativePath(sourceFile)} -> selFreeze 只允许在完整只读边界调用一次")
            }
            if (sourceText =~ /(?:window|global)\s*\.\s*sel[A-Z][A-Za-z0-9]*/) {
                registryViolations.add("${project.relativePath(sourceFile)} -> shared 仍在读写旧式平铺 SEL API")
            }
        }
        if (!registryViolations.isEmpty()) {
            throw new GradleException("sel-ui 公共控件治理门禁失败：\n" + registryViolations.join('\n'))
        }
        // Grid 与 Tree 的截断文字提示统一归 selTooltip 所有，原生 title 和应用私有提示不得回流。
        def tooltipScript = file('src/components/tooltip/selTooltip.js')
        def gridTooltipConsumer = file('src/components/grid/selGrid.js').getText('UTF-8')
        def treeTooltipConsumer = file('src/components/tree/selTree.js').getText('UTF-8')
        def tooltipSource = tooltipScript.isFile() ? tooltipScript.getText('UTF-8') : ''
        def tooltipRequired = [
            'window.sel.register("components.tooltip"', 'data-sel-tooltip', 'selTooltipIsTruncated',
            'selTooltipShouldShow', 'dataset.selTooltipMode === "always"',
            'pointerover', 'focusin', 'aria-describedby', 'role", "tooltip',
            'if (selTooltipAriaElement &&'
        ]
        def tooltipViolations = tooltipRequired.findAll { !tooltipSource.contains(it) }.collect { "selTooltip -> ${it}" }
        if (!gridTooltipConsumer.contains('window.sel.components.tooltip.attach')
                || !gridTooltipConsumer.contains('dataset.selTooltip')
                || !gridTooltipConsumer.contains('dataset.selTooltipMode = "always"')
                || gridTooltipConsumer =~ /\.title\s*=|setAttribute\(\s*["']title["']/) {
            tooltipViolations.add('selGrid -> 必须使用 selTooltip 且禁止原生 title')
        }
        if (!treeTooltipConsumer.contains('window.sel.components.tooltip.attach')
                || !treeTooltipConsumer.contains('dataset.selTooltip')) {
            tooltipViolations.add('selTree -> 必须使用 selTooltip')
        }
        if (!tooltipViolations.isEmpty()) {
            throw new GradleException("sel-ui 统一截断文字提示门禁失败：\n" + tooltipViolations.join('\n'))
        }
        // Tab 右键操作是公共组件契约：缺少菜单、批量 API 或正常关闭检查时直接阻断公共前端构建。
        def contextMenuScript = file('src/components/context-menu/selContextMenu.js')
        def contextMenuStyle = file('src/components/context-menu/selContextMenu.css')
        def tabsScript = file('src/components/tabs/selTabs.js')
        if (!contextMenuScript.isFile() || !contextMenuStyle.isFile() || !tabsScript.isFile()) {
            throw new GradleException('sel-ui 缺少 selContextMenu 或 selTabs 权威源文件')
        }
        def contextMenuSource = contextMenuScript.getText('UTF-8')
        def tabsSource = tabsScript.getText('UTF-8')
        def contextRequired = ['window.sel.register("components.contextMenu"', 'selContextMenu:action', 'ArrowDown', 'ContextMenu']
        def tabsRequired = ['contextMenu !== false', 'window.sel.components.contextMenu.mount', 'setContextMenuEnabled:', 'closeRight:', 'closeOthers:', 'closeAll:', 'selTabs:beforeClose']
        def missingContracts = []
        contextRequired.findAll { !contextMenuSource.contains(it) }.each { missingContracts.add("selContextMenu -> ${it}") }
        tabsRequired.findAll { !tabsSource.contains(it) }.each { missingContracts.add("selTabs -> ${it}") }
        if (!missingContracts.isEmpty()) {
            throw new GradleException("sel-ui Tab 右键菜单契约不完整：\n" + missingContracts.join('\n'))
        }
        // 代码编辑器追加内容必须经过公开 API，并同步 change 事件、光标和焦点。
        def codeEditorSource = file('src/components/code-editor/selCodeEditor.js').getText('UTF-8')
        def codeEditorAppendRequired = ['function selCodeEditorAppendValue', 'appendValue: selCodeEditorAppendValue', 'selCodeEditor:change', 'setSelectionRange', 'selCodeEditorInput.focus()']
        def missingCodeEditorAppendContracts = codeEditorAppendRequired.findAll { !codeEditorSource.contains(it) }
        if (!missingCodeEditorAppendContracts.isEmpty()) {
            throw new GradleException("selCodeEditor 追加 API 契约不完整：\n" + missingCodeEditorAppendContracts.join('\n'))
        }
        // 选区读取必须由 selCodeEditor 公开 API 承担，SQL 应用不得依赖控件内部 textarea。
        def codeEditorSelectionRequired = [
            'function selCodeEditorCaptureSelection',
            'function selCodeEditorGetSelectedValue',
            'function selCodeEditorRestoreSelection',
            'getSelectedValue: selCodeEditorGetSelectedValue',
            'restoreSelection: selCodeEditorRestoreSelection',
            'selCodeEditorActions.addEventListener("mousedown"',
            'selCodeEditorEvent.preventDefault()',
            'selectedValue: selCodeEditorSelectedValue',
            'selectionStart',
            'selectionEnd'
        ]
        def missingCodeEditorSelectionContracts = codeEditorSelectionRequired.findAll { !codeEditorSource.contains(it) }
        if (!missingCodeEditorSelectionContracts.isEmpty()) {
            throw new GradleException("selCodeEditor 选区 API 契约不完整：\n" + missingCodeEditorSelectionContracts.join('\n'))
        }
        // selGrid 列宽调整是默认公共契约：必须保留显式关闭属性、表头分隔线、指针调整和键盘调整。
        def gridScript = file('src/components/grid/selGrid.js')
        def gridStyle = file('src/components/grid/selGrid.css')
        if (!gridScript.isFile() || !gridStyle.isFile()) {
            throw new GradleException('sel-ui 缺少 selGrid 权威源文件')
        }
        def gridSource = gridScript.getText('UTF-8')
        def gridStyleSource = gridStyle.getText('UTF-8')
        def gridResizeRequired = ['columnResize !== false', 'data-sel-grid-column-resize', 'selGridHandleColumnResizeMove', 'selGridHandleColumnResizeKeydown', 'setPointerCapture']
        def gridResizeStyleRequired = ['selgrid-column-resize-handle', 'cursor: col-resize', 'touch-action: none']
        def missingGridResizeContracts = []
        gridResizeRequired.findAll { !gridSource.contains(it) }.each { missingGridResizeContracts.add("selGrid.js -> ${it}") }
        gridResizeStyleRequired.findAll { !gridStyleSource.contains(it) }.each { missingGridResizeContracts.add("selGrid.css -> ${it}") }
        if (!missingGridResizeContracts.isEmpty()) {
            throw new GradleException("selGrid 默认列宽调整契约不完整：\n" + missingGridResizeContracts.join('\n'))
        }
        // 字段级筛选选择必须由 selGrid 提供公开契约，业务应用不得自行改写公共表头 DOM。
        def gridHeaderSelectionRequired = ['headerSelectable === true', 'data-sel-grid-header-column-select', 'selGrid:headerSelectionChange', 'getSelectedColumnKeys:', 'selectedColumnKeys:']
        def missingGridHeaderSelectionContracts = gridHeaderSelectionRequired.findAll { !gridSource.contains(it) }
        if (!missingGridHeaderSelectionContracts.isEmpty()) {
            throw new GradleException("selGrid 表头字段选择契约不完整：\n" + missingGridHeaderSelectionContracts.join('\n'))
        }
        // 行选择由公共 Grid 统一提供 NONE、SINGLE、MULTIPLE 三态，并公开状态与变化事件。
        def gridRowSelectionRequired = [
            'function selGridResolveSelectionMode', '["NONE", "SINGLE", "MULTIPLE"]',
            'selGridRecordMode ? "NONE" : "MULTIPLE"', 'selGridRenderer === "selection"',
            'selGrid:selectionChange', 'getSelectedIds:', 'getSelectionMode:', 'aria-selected'
        ]
        def missingGridRowSelectionContracts = gridRowSelectionRequired.findAll { !gridSource.contains(it) }
        if (!missingGridRowSelectionContracts.isEmpty()) {
            throw new GradleException("selGrid 行选择契约不完整：\n" + missingGridRowSelectionContracts.join('\n'))
        }
        // 记录分类既可为标量也可为数组；工具栏和树筛选必须统一按成员匹配，允许一条记录属于多个分类。
        def gridMultiValueTypeRequired = [
            'function selGridNormalizeRecordTypeValues',
            'Array.isArray(selGridValue) ? selGridValue : [selGridValue]',
            'selGridTypeValues.includes(String(selGridState.type))',
            'selGridTypeValues.includes(String(selGridState.treeFilter.type))',
            'selGridState.treeFilter.typeGroup.some((selGridType) => selGridTypeValues.includes(String(selGridType)))'
        ]
        def missingGridMultiValueTypeContracts = gridMultiValueTypeRequired.findAll { !gridSource.contains(it) }
        if (!missingGridMultiValueTypeContracts.isEmpty()) {
            throw new GradleException(
                "selGrid 多值分类筛选契约不完整：\n"
                        + missingGridMultiValueTypeContracts.collect { "selGrid.js -> ${it}" }.join('\n')
            )
        }
        // 数据库列配置可以选择 boolean 渲染器；公共 Grid 统一处理 JDBC 布尔值和多语言真假文案。
        def gridBooleanRequired = [
            'selGridRenderer === "boolean"',
            'selGridColumn.trueLabel || "是"',
            'selGridColumn.falseLabel || "否"'
        ]
        def missingGridBooleanContracts = gridBooleanRequired.findAll { !gridSource.contains(it) }
        if (!missingGridBooleanContracts.isEmpty()) {
            throw new GradleException(
                "selGrid 布尔列渲染契约不完整：\n"
                        + missingGridBooleanContracts.collect { "selGrid.js -> ${it}" }.join('\n')
            )
        }
        // selPanel 工具栏栏目默认可拖拽；公共层拥有分隔线与生命周期，MDA 只允许传标准宽度配置。
        def panelScript = file('src/components/panel/selPanel.js')
        def panelStyle = file('src/components/panel/selPanel.css')
        def mdaAssembler = rootProject.file('apps/mda/backend/src/main/resources/static/mda/mda.js')
        if (!panelScript.isFile() || !panelStyle.isFile() || !mdaAssembler.isFile()) {
            throw new GradleException('sel-ui 工具栏栏目缩放缺少 selPanel 或 MDA 首个调用方权威源文件')
        }
        def panelSource = panelScript.getText('UTF-8')
        def panelStyleSource = panelStyle.getText('UTF-8')
        def mdaSource = mdaAssembler.getText('UTF-8')
        def panelResizeRequired = [
            'columnResize !== false', 'selpanel-toolbar-column-resizer',
            'selPanel:toolbarColumnResize', 'requestAnimationFrame',
            'lostpointercapture', 'dblclick'
        ]
        def panelResizeStyleRequired = [
            'selpanel-toolbar-column-resizer', 'cursor: col-resize',
            'touch-action: none', 'selpanel-toolbar-column-resizing'
        ]
        def mdaResizeRequired = [
            'mdaToolbarOptions', 'width: 360', 'minWidth: 240',
            'maxWidth: 720', 'toolbar: mdaToolbarOptions'
        ]
        def missingPanelResizeContracts = []
        panelResizeRequired.findAll { !panelSource.contains(it) }.each { missingPanelResizeContracts.add("selPanel.js -> ${it}") }
        panelResizeStyleRequired.findAll { !panelStyleSource.contains(it) }.each { missingPanelResizeContracts.add("selPanel.css -> ${it}") }
        mdaResizeRequired.findAll { !mdaSource.contains(it) }.each { missingPanelResizeContracts.add("mda.js -> ${it}") }
        if (!missingPanelResizeContracts.isEmpty()) {
            throw new GradleException("selPanel 工具栏栏目缩放契约不完整：\n" + missingPanelResizeContracts.join('\n'))
        }
    }
}

tasks.named('check') {
    // 标准检查必须同时验证公共前端没有反向依赖具体应用。
    dependsOn tasks.named('verifySelUiSourceBoundary')
}

tasks.named('jar') {
    // 发布资源 JAR 前先确认共享源码边界，防止业务地址进入所有项目。
    dependsOn tasks.named('verifySelUiSourceBoundary')
}
