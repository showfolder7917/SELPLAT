<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cyan-amber-dark preview</title>
    <link rel="stylesheet" href="../skin-components.css" />
  </head>
  <body>
    <main class="attendance-page">
      <header class="hero">
        <div>
          <p class="hero-tag">Attendance Theme</p>
          <h1>cyan-amber-dark</h1>
          <p class="hero-subtitle">面向考勤主数据工作台的深色玻璃主题预览。</p>
        </div>
        <div class="language-switch">
          <button class="language-button active" type="button">
            <span class="language-label">简体中文</span>
            <span class="language-subtitle">CN</span>
          </button>
          <button class="language-button" type="button">
            <span class="language-label">日本語</span>
            <span class="language-subtitle">JP</span>
          </button>
        </div>
      </header>

      <div class="top-grid">
        <section class="panel panel-highlight">
          <div class="panel-header">
            <div>
              <p class="eyebrow">phase one</p>
              <h2>步骤卡</h2>
            </div>
            <span class="status-chip">进行中</span>
          </div>
          <div class="step-grid">
            <article class="step-card">
              <div class="step-row">
                <span class="step-title">事业所</span>
                <span class="step-status">已完成</span>
              </div>
              <p class="step-description">预览主题对步骤统计和状态芯片的呈现方式。</p>
              <strong class="step-count">3</strong>
            </article>
            <article class="step-card">
              <div class="step-row">
                <span class="step-title">员工</span>
                <span class="step-status">待处理</span>
              </div>
              <p class="step-description">保留深色玻璃背景与高亮按钮的整体关系。</p>
              <strong class="step-count">24</strong>
            </article>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>表单与表格</h2>
          </div>
          <div class="form-grid">
            <label><span>租户名</span><input value="株式会社 SEL" /></label>
            <label><span>时区</span><input value="Asia/Tokyo" /></label>
          </div>
          <div class="button-row">
            <button class="primary-button" type="button">保存</button>
            <button class="secondary-button" type="button">新建</button>
          </div>
          <div class="subpanel">
            <table class="data-table">
              <thead>
                <tr>
                  <th>编码</th>
                  <th>名称</th>
                  <th>状态</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>HQ</td>
                  <td>Tokyo HQ</td>
                  <td>ACTIVE</td>
                  <td class="table-actions">
                    <button type="button">编辑</button>
                    <button type="button">删除</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
