plugins {
    // common-web 作为公共 Web 基类库，只负责编译和被业务模块继承，不承担独立启动职责。
    id 'java-library'
    // JaCoCo 记录公共控制器路径和响应边界的真实执行覆盖。
    id 'jacoco'
}

dependencies {
    // common-web 依赖 common-core，便于后续 BaseController 逐步沉淀公共结果封装和通用工具时保持依赖方向稳定。
    api project(':shared:backend:common-core')
    // common-web 依赖 common-service，供 BaseController 直接声明统一服务层返回类型。
    api project(':shared:backend:common-service')
    // 公共控制器与参数解析器公开 Spring MVC 类型，使用 api 让业务模块获得一致的 Web 编译契约。
    api 'org.springframework:spring-webmvc:6.2.7'
    // 参数解析器直接引用 HttpServletRequest，Servlet API 仅用于编译并由实际 Web 容器在运行期提供。
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    // common-web 需要用 JUnit 5 验证公共控制器的请求上下文和路径解析规则。
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    // JUnit 5.12.2 需要匹配的 Platform Launcher 才能在 Gradle 测试发现阶段正确加载测试引擎。
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    // Spring MVC 测试工具提供可控请求对象，避免公共控制器测试依赖真实 Tomcat 或业务数据库。
    testImplementation 'org.springframework:spring-test:6.2.7'
    // 测试中的模拟请求需引用 Servlet API 类型，只在测试类路径提供，不引入生产运行依赖。
    testCompileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    // JUnit 装载模拟请求测试类时也需解析 Servlet API 类型，仅在测试运行期补齐该依赖。
    testRuntimeOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

java {
    withSourcesJar()
}

jacoco {
    // 与工程其他模块统一覆盖工具版本。
    toolVersion = '0.8.13'
}

tasks.named('test') {
    // 每轮 common-web 测试完成后自动输出覆盖报告。
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    // 覆盖报告必须读取本轮公共控制器测试执行数据。
    dependsOn tasks.named('test')
    reports {
        // XML 供自动门禁和结果核对。
        xml.required = true
        // HTML 供人工审核公共 Web 缺口。
        html.required = true
        // 当前不生成重复 CSV 产物。
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    // 覆盖门禁必须基于公共参数、路径、元数据和响应兼容 Case。
    dependsOn tasks.named('test')
    violationRules {
        // BaseExtendsController 集中承载 shared 公共控制器实际辅助行为。
        rule {
            // CLASS 级门禁避免其他空接口或简单注解影响覆盖结果。
            element = 'CLASS'
            // 当前只锁定已覆盖全部生产方法和可执行行的公共控制器扩展。
            includes = ['com.sp.selplat.common.web.controller.BaseExtendsController']
            limit {
                // 行覆盖率使用真实执行比例。
                counter = 'LINE'
                // COVEREDRATIO 表示覆盖行数占全部可执行行比例。
                value = 'COVEREDRATIO'
                // 公共控制器扩展要求 100% 行覆盖。
                minimum = 1.0
            }
        }
    }
}

tasks.named('check') {
    // common-web 标准检查必须同时执行公共控制器覆盖门禁。
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
