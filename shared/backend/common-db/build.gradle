plugins {
    // common-db 是公共数据库层库，只承接模板和公共持久化能力。
    id 'java-library'
}

dependencies {
    // common-db 可以复用 common-core 里的公共支持类，保持依赖方向单向稳定。
    api project(':shared:backend:common-core')

    if (gradle.startParameter.isOffline()) {
        // 离线模式下优先从工作区本地仓库取 MyBatis 与 H2，避免再穿透用户目录缓存解析。
        implementation files(
            "${rootProject.projectDir}/localrepository/cache-jars/mybatis-3.5.17.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/h2-2.3.232.jar"
        )
        // 正式测试需要 JUnit 与 Jackson 解析 JSON 资源，因此离线时也要把测试依赖显式收口到工作区本地仓库。
        testImplementation files(
            "${rootProject.projectDir}/localrepository/cache-jars/junit-jupiter-api-5.12.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/junit-jupiter-params-5.12.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/jackson-annotations-2.19.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/jackson-core-2.19.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/jackson-databind-2.19.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/apiguardian-api-1.1.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/opentest4j-1.3.0.jar"
        )
        // JUnit Platform 运行测试时还需要引擎与平台运行时组件。
        testRuntimeOnly files(
            "${rootProject.projectDir}/localrepository/cache-jars/junit-jupiter-engine-5.12.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/junit-platform-engine-1.12.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/junit-platform-commons-1.12.2.jar",
            "${rootProject.projectDir}/localrepository/cache-jars/junit-platform-launcher-1.12.2.jar"
        )
    } else {
        // 在线模式下仍优先走标准坐标依赖，便于后续收敛到正常仓库管理。
        api 'org.mybatis:mybatis:3.5.17'
        // 公共 DAO 的正式测试仍然直接使用 H2 内存库，因此主源码编译阶段需要 H2。
        implementation "com.h2database:h2:${h2Version}"
        // 正式测试统一走 JUnit 5，保持和根工程测试平台一致。
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        // JSON 资源测试需要 Jackson 把输入和期望结果映射成对象结构。
        testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    }
}

java {
    withSourcesJar()
}
