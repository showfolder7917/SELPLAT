plugins {
    // common-db 是公共数据库层库，只承接模板和公共持久化能力。
    id 'java-library'
}

dependencies {
    // common-db 可以复用 common-core 里的公共支持类，保持依赖方向单向稳定。
    api project(':shared:backend:common-core')
    // 统一使用标准 Maven 坐标，让 VS Code、Gradle 在线模式和 --offline 缓存模式共享同一套解析链路。
    api 'org.mybatis:mybatis:3.5.17'
    // 公共 DAO 的正式测试仍然直接使用 H2 内存库，因此主源码编译阶段需要 H2。
    implementation "com.h2database:h2:${h2Version}"
    // 正式测试统一走 JUnit 5，保持和根工程测试平台一致。
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    // JSON 资源测试需要 Jackson 把输入和期望结果映射成对象结构。
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
}

java {
    withSourcesJar()
}
