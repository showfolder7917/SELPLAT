plugins {
    // common-core 是公共库，只负责编译和被依赖，不承担启动职责。
    id 'java-library'
}

dependencies {
    // JsonUtils 作为对外可复用的公共 JSON 工具，需要把 Jackson 能力透传给依赖 common-core 的下游模块。
    api 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    // JsonUtils 需要支持 Java 8 时间类型序列化，并让下游模块在运行期也能拿到同一套时间序列化能力。
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.2'
    // 文档修复工具通过标准 Maven 坐标使用 OOXML 能力，避免把某台 Windows 机器的 Gradle 缓存绝对路径写入工程。
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    // 旧版 DOC 修复工具需要 HWPF/POIFS 扩展能力，由 scratchpad 坐标统一带入匹配版本依赖。
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    // POI 运行时使用同版本 Log4j2 实现，避免文档工具每次启动都输出缺少日志实现警告。
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.21.1'
    // 通用注音工具需要词组分词、多音字和带声调拼音能力，文档专用纠音仍由外部词典覆盖。
    implementation 'com.github.houbb:pinyin:0.4.0'
    // common-core 的通用文档工具需要通过 JUnit 5 验证纠音、字符对齐和 DOCX 输出结构。
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    // Jupiter 5.12.2 需要匹配的 Platform Launcher，避免 Gradle 内置旧版本导致测试发现阶段失败。
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

java {
    withSourcesJar()
}

tasks.register('runPinyinDocxTool', JavaExec) {
    // 通用拼音任务复用 common-core 的正式运行类路径，避免人工收集 POI 和拼音库依赖。
    group = 'documentation'
    description = 'Generate an editable pinyin DOCX from a Chinese DOCX source.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.sp.selplat.common.tool.pinyin.PinyinDocxGenerationTool'
    // 子项目任务统一使用 UTF-8，避免 LC_ALL=C 时中文路径和业务日志退回 US-ASCII。
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'

    doFirst {
        // 正式运行必须显式指定源和目标，防止任务在当前目录误生成文件。
        def source = providers.gradleProperty('pinyinSource').orNull
        def target = providers.gradleProperty('pinyinTarget').orNull
        if (!source || !target) {
            throw new GradleException('Missing -PpinyinSource or -PpinyinTarget')
        }
        // CLI 参数统一由 Java 工具校验，Gradle 任务只负责把工程属性稳定传入运行时。
        args '--source', rootProject.file(source).absolutePath,
            '--target', rootProject.file(target).absolutePath,
            '--overwrite', providers.gradleProperty('pinyinOverwrite').getOrElse('false'),
            '--dry-run', providers.gradleProperty('pinyinDryRun').getOrElse('false'),
            '--mode', providers.gradleProperty('pinyinMode').getOrElse('paragraph'),
            '--layout', providers.gradleProperty('pinyinLayout').getOrElse('daodejing')
        // 文言文正式生成时传入专用纠音词典；普通样稿允许省略该属性。
        def dictionary = providers.gradleProperty('pinyinDictionary').orNull
        if (dictionary) {
            args '--dictionary', rootProject.file(dictionary).absolutePath
        }
    }
}

tasks.register('runDocTopicImageTool', JavaExec) {
    // 故事图片任务复用 common-core 的 POI、Jackson 和 Java2D 运行类路径，不建立第二套脚本环境。
    group = 'documentation'
    description = 'Generate reviewed poetry story JPG files from finalized pinyin DOCX files.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.sp.selplat.common.tool.docTopic.DocTopicBatchGenerationTool'
    // 批量中文路径、JSON 和日志统一使用 UTF-8，Windows 与 macOS 保持相同行为。
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'

    doFirst {
        // 正式生成必须明确输出根目录和审校故事 JSON，禁止使用当前目录隐式落盘。
        def outputRoot = providers.gradleProperty('docTopicOutputRoot').orNull
        def topicData = providers.gradleProperty('docTopicData').orNull
        if (!outputRoot || !topicData) {
            throw new GradleException('Missing -PdocTopicOutputRoot or -PdocTopicData')
        }
        args '--output-root', rootProject.file(outputRoot).absolutePath,
            '--topic-data', rootProject.file(topicData).absolutePath,
            '--limit', providers.gradleProperty('docTopicLimit').getOrElse('0'),
            '--overwrite', providers.gradleProperty('docTopicOverwrite').getOrElse('false'),
            '--missing-content', providers.gradleProperty('docTopicMissingContent').getOrElse('fail')
        // 单文件样例和批量目录只能选择一个，由 Java 工具继续执行互斥校验。
        def source = providers.gradleProperty('docTopicSource').orNull
        def sourceRoot = providers.gradleProperty('docTopicSourceRoot').orNull
        if (source) {
            args '--source', rootProject.file(source).absolutePath
        }
        if (sourceRoot) {
            args '--source-root', rootProject.file(sourceRoot).absolutePath
        }
    }
}

tasks.register('exportDocTopicManifest', JavaExec) {
    // 图片批处理先导出核定 DOCX 清单，后续 Imagegen 和 Pillow 共用同一份原始数据。
    group = 'documentation'
    // 任务说明明确这里只导出核定文字，不生成插画或教学扩展文案。
    description = 'Export finalized poetry and per-character pinyin from DOCX to a UTF-8 JSON manifest.'
    // 运行前编译正式解析器和清单导出入口。
    dependsOn classes
    // 复用 common-core 的 Apache POI 与 Jackson 运行类路径。
    classpath = sourceSets.main.runtimeClasspath
    // 业务入口固定为只读清单导出工具。
    mainClass = 'com.sp.selplat.common.tool.docTopic.DocTopicManifestExportTool'
    // 中文路径、汉字和带调拼音统一使用 UTF-8。
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'

    doFirst {
        // 源 DOCX 必须由调用方明确指定，禁止扫描并误读其它教材。
        def source = providers.gradleProperty('docTopicManifestSource').orNull
        // 目标 JSON 必须由调用方明确指定，禁止落到工作区根目录。
        def target = providers.gradleProperty('docTopicManifestTarget').orNull
        // 任一路径缺失都在 Java 进程启动前终止。
        if (!source || !target) {
            throw new GradleException('Missing -PdocTopicManifestSource or -PdocTopicManifestTarget')
        }
        // 把工程相对路径转换为绝对路径后交给正式导出工具校验。
        args '--source', rootProject.file(source).absolutePath,
            '--target', rootProject.file(target).absolutePath
    }
}
