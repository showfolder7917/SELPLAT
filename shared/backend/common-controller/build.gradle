plugins {
    // common-controller 作为公共控制器基类库，只负责编译和被业务模块继承，不承担独立启动职责。
    id 'java-library'
}

dependencies {
    // common-controller 依赖 common-core，便于后续 BaseController 逐步沉淀公共结果封装和通用工具时保持依赖方向稳定。
    api project(':shared:backend:common-core')
    // common-controller 依赖 common-service，供 BaseController 直接声明统一服务层返回类型。
    api project(':shared:backend:common-service')
}

java {
    withSourcesJar()
}
