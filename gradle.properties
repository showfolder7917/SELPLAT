# Java 版本按本轮要求统一到 21，供所有子项目共用。
javaVersion=21
# Spring Boot 版本统一收口，避免业务模块各自散写。
springBootVersion=3.5.0
# MyBatis Spring Boot Starter 版本统一收口，保证 DAO 层依赖口径一致。
mybatisSpringBootVersion=3.0.4
# H2 版本统一收口，便于本地最小运行和测试。
h2Version=2.3.232
# JUnit 版本统一收口，供后续测试任务共用。
junitVersion=5.12.2
# Jackson 版本统一收口，避免公共模块和规则工具产生 JSON 组件版本差异。
jacksonVersion=2.19.2
# Spring Framework 版本与 Spring Boot 3.5.0 的离线缓存口径保持一致。
springFrameworkVersion=6.2.7
# AspectJ Weaver 版本统一供 common-service 的 OperationLogAspect 编译与运行使用。
aspectjVersion=1.9.24
# MyBatis 核心版本统一供公共数据库层使用。
mybatisVersion=3.5.17
# Apache POI 版本统一供中文教学文档工具使用。
poiVersion=5.2.5
# Houbb Pinyin 坐标先按中文教学既有约定登记，待离线包进入 cache 后自动解析。
pinyinVersion=0.4.0
# Servlet API 版本统一供公共 Web 编译和测试使用。
servletApiVersion=6.1.0
# JUnit Platform 版本与 JUnit Jupiter 5.12.2 保持匹配。
junitPlatformVersion=1.12.2
# Lombok 只作为编译期工具，从工程 cache 的固定文件读取。
lombokVersion=1.18.38
# JaCoCo 版本统一供业务与公共模块生成同口径覆盖报告。
jacocoVersion=0.8.13
# Gradle 进程统一使用 UTF-8，避免 Windows 下资源文件和中文输出乱码。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 让 Gradle 按当前机器自动探测本地 JDK 安装，避免把单机 Windows 路径写死到仓库中。
org.gradle.java.installations.auto-detect=true
